<!doctype html>
<html>
  <head>
  </head>
  <body>
    <main>
    </main>
    <template id="titulo">
      <article>
        <img src="[imagen]">
        <h3>[titulo]</h3>
        <p>[categoria]</p>
      </article>
    </template>
    <script>
      let contenedor = document.querySelector("main");
      let plantilla = document.querySelector("#titulo")
      fetch("servidor.php")
      .then(function(resultado){return resultado.json()})
      .then(function(datos){
        console.log(datos)
      	datos.forEach(function(dato){
        	let instancia = plantilla.content.cloneNode(true)
          instancia.querySelector("h3").textContent = dato.titulo
          instancia.querySelector("p").textContent = dato.descripcion
          instancia.querySelector("img").setAttribute("src","repositorio/"+dato.imagen)
        	contenedor.appendChild(instancia)
        })
      })
     
    </script>
  </body>
</html>
