<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jocarsa | red</title><link rel="stylesheet" href="estilo.css"></head><body>
<header><strong>jocarsa | red</strong><button id="salir" hidden>Cerrar sesión</button></header>
<section id="login"><h2>Acceso a la red</h2><form id="form-login"><input name="usuario" placeholder="Usuario" required autocomplete="username"><input name="contrasena" type="password" placeholder="Contraseña" required autocomplete="current-password"><button>Entrar</button></form><p id="error-login"></p></section>
<main id="app" hidden><aside id="izquierda"><section id="perfil"></section><h3>Buscar personas</h3><input id="buscar" placeholder="Nombre o usuario"><h3>Usuarios</h3><div id="usuarios"></div></aside><div id="derecha"><h2>Publicaciones de tu red</h2><section id="publicaciones"></section></div></main>
<template id="publicacion"><article><div class="autor"></div><time></time><p class="contenido"></p><button class="ver-comentarios">Comentarios (<span>0</span>)</button><div class="comentarios" hidden><div class="lista-comentarios"></div><form class="form-comentario"><input name="contenido" placeholder="Escribe un comentario" maxlength="3000" required><button>Enviar</button></form></div></article></template>
<script src="comportamiento.js"></script></body></html>
