
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa neuronal con parallax facial</title>

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"
  crossorigin="anonymous">
</script>

<style>
* { box-sizing:border-box; }

html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

canvas {
  display:block;
  width:100%;
  height:100%;
}

#nucleo {
  position:fixed;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  margin:-35px;
  padding:0;
  border:2px solid #65baff;
  border-radius:50%;
  background:#0755c8;
  cursor:pointer;
  z-index:5;
  will-change:transform;
}

#nucleo.activo {
  background:#d9f2ff;
  border-color:white;
}

#reiniciar,#camara {
  position:fixed;
  top:24px;
  width:46px;
  height:46px;
  border:1px solid #29466a;
  border-radius:50%;
  background:#071324;
  color:#9bcfff;
  font-size:24px;
  cursor:pointer;
  z-index:10;
}

#reiniciar { right:24px; }
#camara { right:82px; }

#camara.activo {
  color:white;
  border-color:#69baff;
  background:#12498d;
}

button:focus-visible {
  outline:2px solid white;
  outline-offset:5px;
}

#video {
  position:fixed;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="universo"></canvas>

<video id="video" autoplay playsinline muted></video>

<button id="nucleo"
  aria-label="Activar voz"
  aria-pressed="false"></button>

<button id="camara"
  title="Activar seguimiento facial"
  aria-label="Activar cámara"
  aria-pressed="false">◎</button>

<button id="reiniciar"
  title="Reiniciar dictado"
  aria-label="Reiniciar">↻</button>

<script>

// =======================================
// CONFIGURACIÓN
// =======================================

const EXAGERACION_ESCALA = 350;
const DIAMETRO_MAXIMO = 70;
const DIAMETRO_MINIMO = 2;

const UMBRAL_CAMBIO = .1;
const VELOCIDAD_TRANSICION = 20;

const NUM_NEURONAS_INICIALES = 768;

// PARALLAX
const PARALLAX_MAXIMO = 180;
const PARALLAX_MINIMO = 2;
const SENSIBILIDAD_CABEZA = 3.5;
const SUAVIZADO_CABEZA = 12;

// Fotogramas por segundo de MediaPipe
const FPS_CAMARA = 20;

const TAU = Math.PI*2;
const ANGULO_AUREO = 2.399963229728653;

// =======================================
// ELEMENTOS
// =======================================

const canvas=document.querySelector("#universo");
const ctx=canvas.getContext("2d",{alpha:false});

const nucleo=document.querySelector("#nucleo");
const reiniciar=document.querySelector("#reiniciar");
const botonCamara=document.querySelector("#camara");
const video=document.querySelector("#video");

const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

// =======================================
// ESTADO
// =======================================

let W,H,cx,cy,R,dpr;
let neuronas=[];

let vectorAnterior=null;

let textoAcumulado="";
let textoSesion="";
let ultimoTextoConsultado="";

let peticionActual=0;
let controlador=null;

let escuchando=false;
let reconocimiento=null;
let reinicioReconocimiento=false;

let intensidad=0;
let intensidadSuave=0;

let audioContext=null;
let analizador=null;
let flujoAudio=null;
let datosAudio=null;

let ultimoFrame=0;

// MediaPipe
let faceMesh=null;
let flujoCamara=null;
let camaraActiva=false;
let procesandoCara=false;
let ultimoAnalisis=0;
let sesionCamara=0;

// Posición de la cabeza
let cabezaX=0;
let cabezaY=0;
let cabezaObjetivoX=0;
let cabezaObjetivoY=0;

// Posición de referencia
let referenciaCabeza=null;

// =======================================
// UTILIDADES
// =======================================

function limitar(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function normalizarTexto(texto){
  return texto.replace(/\s+/g," ").trim();
}

function suavizar(actual,objetivo,dt,velocidad){
  return actual+
    (objetivo-actual)*
    (1-Math.exp(-dt*velocidad));
}

// =======================================
// CANVAS
// =======================================

function ajustar(){
  W=innerWidth;
  H=innerHeight;

  dpr=Math.min(devicePixelRatio||1,1.5);

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  cx=W/2;
  cy=H/2;
  R=Math.min(W,H)*.43;

  colocarNeuronas();
}

function crearNeuronas(total){
  neuronas=[];

  for(let i=0;i<total;i++){
    neuronas.push({
      x:0,
      y:0,
      valor:0,
      diametro:DIAMETRO_MINIMO,
      diametroActual:DIAMETRO_MINIMO,
      activacion:0,
      activacionActual:0
    });
  }

  colocarNeuronas();
}

function colocarNeuronas(){
  let total=neuronas.length;
  if(!total)return;

  neuronas.forEach((n,i)=>{
    let angulo=i*ANGULO_AUREO;
    let radio=R*Math.sqrt((i+.5)/total);

    n.x=cx+Math.cos(angulo)*radio;
    n.y=cy+Math.sin(angulo)*radio;
  });
}

// =======================================
// EMBEDDINGS DEL TEXTO COMPLETO
// =======================================

function actualizarVector(vector){

  if(neuronas.length!==vector.length){
    crearNeuronas(vector.length);
    vectorAnterior=null;
  }

  vector.forEach((valor,i)=>{
    let n=neuronas[i];
    let anterior=vectorAnterior?.[i];

    let diferencia=anterior===undefined
      ?0
      :Math.abs(valor-anterior);

    let cambio=limitar(
      diferencia/UMBRAL_CAMBIO,0,1
    );

    n.valor=valor;

    n.diametro=limitar(
      DIAMETRO_MINIMO+
      Math.abs(valor)*EXAGERACION_ESCALA+
      cambio*25,
      DIAMETRO_MINIMO,
      DIAMETRO_MAXIMO
    );

    n.activacion=cambio;
  });

  vectorAnterior=[...vector];
}

async function consultarTexto(texto){

  texto=normalizarTexto(texto);

  if(!texto||texto===ultimoTextoConsultado)return;

  ultimoTextoConsultado=texto;

  if(controlador)controlador.abort();

  controlador=new AbortController();
  let numero=++peticionActual;

  try{
    let respuesta=await fetch(
      "007-servidor.php?palabra="+
      encodeURIComponent(texto),
      {signal:controlador.signal}
    );

    if(!respuesta.ok){
      throw Error("HTTP "+respuesta.status);
    }

    let datos=await respuesta.json();

    if(numero!==peticionActual)return;
    if(!Array.isArray(datos))return;

    let vector=datos.map(Number);

    if(!vector.length||
       !vector.every(Number.isFinite))return;

    actualizarVector(vector);

  }catch(error){
    if(error.name!=="AbortError"){
      console.error(error);
      if(numero===peticionActual){
        ultimoTextoConsultado="";
      }
    }
  }
}

// =======================================
// RECONOCIMIENTO DE VOZ
// =======================================

if(SpeechRecognition){

  reconocimiento=new SpeechRecognition();

  reconocimiento.lang="es-ES";
  reconocimiento.continuous=true;
  reconocimiento.interimResults=true;
  reconocimiento.maxAlternatives=1;

  reconocimiento.onresult=function(evento){

    let confirmado="";
    let provisional="";

    for(let i=0;i<evento.results.length;i++){
      let frase=evento.results[i][0].transcript;

      if(evento.results[i].isFinal){
        confirmado+=frase+" ";
      }else{
        provisional+=frase;
      }
    }

    textoSesion=normalizarTexto(
      confirmado+" "+provisional
    );

    consultarTexto(
      textoAcumulado+" "+textoSesion
    );
  };

  reconocimiento.onerror=function(e){
    console.warn("Voz:",e.error);

    if(e.error==="not-allowed"||
       e.error==="service-not-allowed"){
      detenerVoz();
    }
  };

  reconocimiento.onend=function(){

    if(reinicioReconocimiento){
      reinicioReconocimiento=false;
      textoSesion="";
    }else{
      textoAcumulado=normalizarTexto(
        textoAcumulado+" "+textoSesion
      );
      textoSesion="";
    }

    if(escuchando){
      try{reconocimiento.start()}catch(e){
        console.warn(e);
      }
    }
  };
}

// =======================================
// AUDIO
// =======================================

async function activarAudio(){

  flujoAudio=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    }
  });

  audioContext=new (
    window.AudioContext||
    window.webkitAudioContext
  )();

  let fuente=audioContext.createMediaStreamSource(
    flujoAudio
  );

  analizador=audioContext.createAnalyser();
  analizador.fftSize=512;
  analizador.smoothingTimeConstant=.5;

  fuente.connect(analizador);
  datosAudio=new Uint8Array(analizador.fftSize);
}

function medirVoz(){

  if(!analizador){
    intensidad=0;
    return;
  }

  analizador.getByteTimeDomainData(datosAudio);

  let suma=0;

  for(let i=0;i<datosAudio.length;i++){
    let v=(datosAudio[i]-128)/128;
    suma+=v*v;
  }

  let rms=Math.sqrt(suma/datosAudio.length);
  intensidad=limitar((rms-.008)*18,0,1);
}

async function activarVoz(){

  if(!reconocimiento||escuchando)return;

  escuchando=true;

  try{
    await activarAudio();

    if(!escuchando){
      detenerVoz();
      return;
    }

    reconocimiento.start();

    nucleo.classList.add("activo");
    nucleo.setAttribute("aria-pressed","true");

  }catch(e){
    console.error(e);
    detenerVoz();
  }
}

function detenerVoz(){

  escuchando=false;

  nucleo.classList.remove("activo");
  nucleo.setAttribute("aria-pressed","false");

  if(reconocimiento){
    try{reconocimiento.stop()}catch(e){}
  }

  if(flujoAudio){
    flujoAudio.getTracks().forEach(t=>t.stop());
    flujoAudio=null;
  }

  if(audioContext){
    audioContext.close();
    audioContext=null;
  }

  analizador=null;
  intensidad=0;
}

nucleo.onclick=function(){
  if(escuchando)detenerVoz();
  else activarVoz();
};

// =======================================
// MEDIAPIPE FACE MESH
// =======================================

async function iniciarCamara(){

  if(camaraActiva)return;

  if(typeof FaceMesh==="undefined"){
    console.error("MediaPipe no está disponible");
    return;
  }

  camaraActiva=true;
  const sesion=++sesionCamara;

  try{

    flujoCamara=await navigator.mediaDevices.getUserMedia({
      video:{
        width:{ideal:640},
        height:{ideal:480},
        frameRate:{ideal:30},
        facingMode:"user"
      },
      audio:false
    });

    if(!camaraActiva||sesion!==sesionCamara){
      flujoCamara.getTracks().forEach(t=>t.stop());
      flujoCamara=null;
      return;
    }

    video.srcObject=flujoCamara;
    await video.play();

    if(!camaraActiva||sesion!==sesionCamara)return;

    if(!faceMesh){

      faceMesh=new FaceMesh({
        locateFile:(file)=>
          "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/"+
          file
      });

      faceMesh.setOptions({
        maxNumFaces:1,
        refineLandmarks:false,
        minDetectionConfidence:.6,
        minTrackingConfidence:.6
      });

      faceMesh.onResults(procesarCara);
    }

    referenciaCabeza=null;

    botonCamara.classList.add("activo");
    botonCamara.setAttribute("aria-pressed","true");

    bucleCamara(sesion);

  }catch(e){
    console.error("Cámara:",e);
    detenerCamara();
  }
}

// ---------------------------------------
// Obtener posición de la cabeza
// ---------------------------------------

function procesarCara(resultados){

  if(!camaraActiva)return;

  let caras=resultados.multiFaceLandmarks;

  if(!caras||!caras.length){
    cabezaObjetivoX=0;
    cabezaObjetivoY=0;
    return;
  }

  let puntos=caras[0];

  // Centro aproximado del rostro usando
  // ambos extremos laterales y frente/mentón.
  let izquierda=puntos[234];
  let derecha=puntos[454];
  let frente=puntos[10];
  let menton=puntos[152];

  let x=(izquierda.x+derecha.x)/2;
  let y=(frente.y+menton.y)/2;

  // Calibración automática con la primera
  // posición detectada.
  if(referenciaCabeza===null){
    referenciaCabeza={x,y};
  }

  let dx=(x-referenciaCabeza.x)*
    SENSIBILIDAD_CABEZA;

  let dy=(y-referenciaCabeza.y)*
    SENSIBILIDAD_CABEZA;

  // Invertir X para un efecto de ventana:
  // mover la cabeza a la derecha hace que
  // los objetos próximos se desplacen a la izquierda.
  cabezaObjetivoX=limitar(-dx,-1,1);
  cabezaObjetivoY=limitar(-dy,-1,1);
}

// ---------------------------------------
// Ejecutar MediaPipe a FPS limitado
// ---------------------------------------

async function bucleCamara(sesion){

  if(!camaraActiva||sesion!==sesionCamara)return;

  requestAnimationFrame(()=>bucleCamara(sesion));

  if(procesandoCara||
     video.readyState<2||
     !faceMesh)return;

  let ahora=performance.now();

  if(ahora-ultimoAnalisis<1000/FPS_CAMARA)return;

  ultimoAnalisis=ahora;
  procesandoCara=true;

  try{
    await faceMesh.send({image:video});
  }catch(e){
    if(camaraActiva)console.warn(e);
  }finally{
    procesandoCara=false;
  }
}

function detenerCamara(){

  camaraActiva=false;
  sesionCamara++;

  if(flujoCamara){
    flujoCamara.getTracks().forEach(t=>t.stop());
    flujoCamara=null;
  }

  video.pause();
  video.srcObject=null;

  referenciaCabeza=null;
  cabezaObjetivoX=0;
  cabezaObjetivoY=0;

  botonCamara.classList.remove("activo");
  botonCamara.setAttribute("aria-pressed","false");
}

botonCamara.onclick=function(){
  if(camaraActiva)detenerCamara();
  else iniciarCamara();
};

// =======================================
// REINICIO
// =======================================

reiniciar.onclick=function(){

  peticionActual++;

  if(controlador){
    controlador.abort();
    controlador=null;
  }

  textoAcumulado="";
  textoSesion="";
  ultimoTextoConsultado="";
  vectorAnterior=null;

  neuronas.forEach(n=>{
    n.valor=0;
    n.diametro=DIAMETRO_MINIMO;
    n.diametroActual=DIAMETRO_MINIMO;
    n.activacion=0;
    n.activacionActual=0;
  });

  // Recalibrar el centro de la cabeza
  referenciaCabeza=null;
  cabezaObjetivoX=0;
  cabezaObjetivoY=0;

  // Mantener cámara y micrófono encendidos
  if(escuchando&&reconocimiento){
    reinicioReconocimiento=true;
    try{reconocimiento.abort()}catch(e){}
  }
};

// =======================================
// RENDERIZADO 2D CON PARALLAX
// =======================================

function dibujarNeuronas(dt){

  let suavizado=1-Math.exp(
    -dt*VELOCIDAD_TRANSICION
  );

  for(let n of neuronas){

    n.diametroActual+=
      (n.diametro-n.diametroActual)*suavizado;

    n.activacionActual+=
      (n.activacion-n.activacionActual)*suavizado;

    let diametro=n.diametroActual;
    let activacion=n.activacionActual;

    // ====================================
    // PROFUNDIDAD SEGÚN TAMAÑO
    // ====================================

    let profundidad=limitar(
      (diametro-DIAMETRO_MINIMO)/
      (DIAMETRO_MAXIMO-DIAMETRO_MINIMO),
      0,1
    );

    // Curva no lineal:
    // las grandes se mueven muchísimo,
    // las pequeñas apenas se desplazan.
    profundidad=Math.pow(profundidad,2.2);

    let desplazamiento=
      PARALLAX_MINIMO+
      profundidad*PARALLAX_MAXIMO;

    let x=n.x+cabezaX*desplazamiento;
    let y=n.y+cabezaY*desplazamiento;

    // ====================================
    // COLOR BLANCO -> AZUL
    // ====================================

    let rojo=Math.round(
      255-(255-22)*activacion
    );

    let verde=Math.round(
      255-(255-139)*activacion
    );

    ctx.beginPath();
    ctx.arc(
      x,y,
      diametro/2,
      0,TAU
    );

    ctx.fillStyle=
      `rgb(${rojo},${verde},255)`;

    ctx.fill();
  }
}

// =======================================
// NÚCLEO CENTRAL
// =======================================

function dibujarNucleo(){
  let escala=1+intensidadSuave*1.8;
  nucleo.style.transform=`scale(${escala})`;
}

// =======================================
// ANIMACIÓN
// =======================================

function animar(timestamp){

  let dt=ultimoFrame
    ?Math.min((timestamp-ultimoFrame)/1000,.05)
    :1/60;

  ultimoFrame=timestamp;

  medirVoz();

  intensidadSuave=suavizar(
    intensidadSuave,intensidad,dt,18
  );

  // Seguimiento facial suavizado
  cabezaX=suavizar(
    cabezaX,cabezaObjetivoX,dt,
    SUAVIZADO_CABEZA
  );

  cabezaY=suavizar(
    cabezaY,cabezaObjetivoY,dt,
    SUAVIZADO_CABEZA
  );

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);

  dibujarNeuronas(dt);
  dibujarNucleo();

  requestAnimationFrame(animar);
}

// =======================================
// INICIALIZACIÓN
// =======================================

addEventListener("resize",ajustar);

addEventListener("beforeunload",()=>{
  detenerCamara();
  detenerVoz();
});

ajustar();
crearNeuronas(NUM_NEURONAS_INICIALES);
requestAnimationFrame(animar);

</script>
</body>
</html>
