
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: sans-serif;
    }

    #rejilla {
      width: 500px;
      height: 500px;
      border: 1px solid #ddd;
      border-radius: 50%;
      position: relative;
      margin: 30px auto;
      background: #f8f8f8;
    }

    .bloque {
      width: 6px;
      height: 6px;
      background: black;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div id="rejilla"></div>
  <input placeholder="Escribe una palabra">

  <script>
    let rejilla = document.querySelector("#rejilla");
    let entrada = document.querySelector("input");

    entrada.onblur = function() {

      fetch("007-servidor.php?palabra=" +
        encodeURIComponent(entrada.value))
      .then(function(resultado) {
        return resultado.json();
      })
      .then(function(datos) {

        rejilla.innerHTML = "";

        let total = datos.length;
        let centro = 250;
        let radioMaximo = 230;

        datos.forEach(function(dato, i) {

          // Distribución en espiral de Fermat
          let angulo = i * 2.399963229728653;
          let radio = radioMaximo *
            Math.sqrt((i + 0.5) / total);

          let x = centro + Math.cos(angulo) * radio;
          let y = centro + Math.sin(angulo) * radio;

          let bloque = document.createElement("div");
          bloque.className = "bloque";

          bloque.style.left = x + "px";
          bloque.style.top = y + "px";

          bloque.style.width = "6px";
          bloque.style.height = "6px";

          bloque.style.transform =
            "translate(-50%, -50%) scale(" +
            ((Number(dato) + 0.2) * 3) + ")";

          rejilla.appendChild(bloque);

        });

      });
    };
  </script>
</body>
</html>
