
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa neuronal 2D</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#nucleo{
  position:fixed;
  left:50%;
  top:50%;

  width:70px;
  height:70px;
  margin:-35px;

  padding:0;
  border:2px solid #65baff;
  border-radius:50%;

  background:#0755c8;

  cursor:pointer;
  z-index:5;

  transform:scale(1);
  will-change:transform;

  transition:
    background .2s,
    border-color .2s;
}

#nucleo.activo{
  background:#d9f2ff;
  border-color:white;
}

#nucleo:focus-visible{
  outline:2px solid white;
  outline-offset:8px;
}
</style>
</head>

<body>

<canvas id="universo"></canvas>

<button
  id="nucleo"
  aria-label="Activar reconocimiento de voz"
  aria-pressed="false">
</button>

<script>

// ========================================
// CONFIGURACIÓN VISUAL
// ========================================

const EXAGERACION_ESCALA = 350;
const DIAMETRO_MAXIMO = 70;
const DIAMETRO_MINIMO = 2;

const UMBRAL_CAMBIO = 0.1;
const VELOCIDAD_TRANSICION = 20;

const NUM_NEURONAS_INICIALES = 768;

const COLOR_INACTIVO = "#ffffff";
const COLOR_ACTIVO = "#168bff";

const TAU = Math.PI * 2;
const ANGULO_AUREO = 2.399963229728653;

// ========================================
// ELEMENTOS
// ========================================

const canvas =
  document.querySelector("#universo");

const ctx =
  canvas.getContext("2d", {alpha:false});

const nucleo =
  document.querySelector("#nucleo");

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

// ========================================
// ESTADO
// ========================================

let W,H,cx,cy,R,dpr;

let neuronas = [];

let vectorAnterior = null;

let ultimaPalabra = "";
let peticionActual = 0;
let controlador = null;

let escuchando = false;
let reconocimiento = null;

let intensidad = 0;
let intensidadSuave = 0;

let audioContext = null;
let analizador = null;
let flujo = null;
let datosAudio = null;

let ultimoFrame = 0;

// ========================================
// UTILIDADES
// ========================================

function limitar(valor,minimo,maximo){
  return Math.max(
    minimo,
    Math.min(maximo,valor)
  );
}

// ========================================
// DIMENSIONES
// ========================================

function ajustar(){

  W = innerWidth;
  H = innerHeight;

  dpr = Math.min(
    devicePixelRatio || 1,
    1.5
  );

  canvas.width = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  cx = W/2;
  cy = H/2;

  R = Math.min(W,H)*0.43;

  colocarNeuronas();
}

// ========================================
// CREAR NEURONAS
// ========================================

function crearNeuronas(total){

  neuronas = [];

  for(let i=0;i<total;i++){

    neuronas.push({

      x:0,
      y:0,

      valor:0,
      cambio:0,

      diametro:DIAMETRO_MINIMO,
      diametroActual:DIAMETRO_MINIMO,

      activacion:0,
      activacionActual:0

    });
  }

  colocarNeuronas();
}

// ========================================
// DISTRIBUCIÓN FIJA EN CÍRCULO
// ========================================

function colocarNeuronas(){

  let total = neuronas.length;

  if(!total)return;

  neuronas.forEach(function(n,i){

    let angulo =
      i * ANGULO_AUREO;

    let radio =
      R * Math.sqrt(
        (i+0.5)/total
      );

    n.x =
      cx + Math.cos(angulo)*radio;

    n.y =
      cy + Math.sin(angulo)*radio;

  });
}

// ========================================
// ACTUALIZAR EMBEDDING
// ========================================

function actualizarVector(vector){

  if(neuronas.length !== vector.length){

    crearNeuronas(vector.length);

    vectorAnterior = null;
  }

  vector.forEach(function(valor,i){

    let neurona = neuronas[i];

    let anterior =
      vectorAnterior?.[i];

    let diferencia =
      anterior === undefined
      ? 0
      : Math.abs(valor-anterior);

    let cambio = limitar(
      diferencia/UMBRAL_CAMBIO,
      0,1
    );

    neurona.valor = valor;
    neurona.cambio = cambio;

    // Exageración del tamaño según
    // la magnitud de la dimensión
    let magnitud = Math.abs(valor);

    neurona.diametro = limitar(

      DIAMETRO_MINIMO +
      magnitud*EXAGERACION_ESCALA +
      cambio*25,

      DIAMETRO_MINIMO,
      DIAMETRO_MAXIMO

    );

    // Color según cambio semántico
    neurona.activacion = cambio;

  });

  vectorAnterior = [...vector];
}

// ========================================
// CONSULTAR EMBEDDING
// ========================================

async function consultarPalabra(palabra){

  palabra = palabra.toLowerCase()
    .replace(
      /^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,
      ""
    );

  if(!palabra)return;

  if(palabra === ultimaPalabra)return;

  ultimaPalabra = palabra;

  if(controlador){
    controlador.abort();
  }

  controlador = new AbortController();

  let numero = ++peticionActual;

  try{

    let respuesta = await fetch(

      "007-servidor.php?palabra=" +
      encodeURIComponent(palabra),

      {
        signal:controlador.signal
      }

    );

    if(!respuesta.ok){
      throw Error(
        "HTTP "+respuesta.status
      );
    }

    let datos = await respuesta.json();

    if(numero !== peticionActual)return;

    if(!Array.isArray(datos))return;

    let vector = datos.map(Number);

    if(
      !vector.length ||
      !vector.every(Number.isFinite)
    )return;

    actualizarVector(vector);

  }catch(error){

    if(error.name !== "AbortError"){
      console.error(error);
    }
  }
}

// ========================================
// RECONOCIMIENTO DE VOZ
// ========================================

if(SpeechRecognition){

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang = "es-ES";

  reconocimiento.continuous = true;
  reconocimiento.interimResults = true;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onresult = function(evento){

    let texto = "";

    for(
      let i=0;
      i<evento.results.length;
      i++
    ){

      texto +=
        evento.results[i][0].transcript +
        " ";

    }

    let palabras =
      texto.trim().split(/\s+/);

    if(palabras.length){

      consultarPalabra(
        palabras[palabras.length-1]
      );

    }
  };

  reconocimiento.onerror = function(evento){

    console.warn(evento.error);

    if(
      evento.error === "not-allowed" ||
      evento.error === "service-not-allowed"
    ){
      detener();
    }
  };

  reconocimiento.onend = function(){

    if(escuchando){

      try{
        reconocimiento.start();
      }catch(error){
        console.error(error);
      }

    }
  };
}

// ========================================
// MICRÓFONO Y VOLUMEN
// ========================================

async function activarAudio(){

  flujo =
    await navigator.mediaDevices.getUserMedia({

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }

    });

  audioContext = new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  let fuente =
    audioContext.createMediaStreamSource(
      flujo
    );

  analizador =
    audioContext.createAnalyser();

  analizador.fftSize = 512;
  analizador.smoothingTimeConstant = 0.5;

  fuente.connect(analizador);

  datosAudio =
    new Uint8Array(
      analizador.fftSize
    );
}

// ========================================
// MEDIR INTENSIDAD
// ========================================

function medirVoz(){

  if(!analizador){

    intensidad = 0;
    return;
  }

  analizador.getByteTimeDomainData(
    datosAudio
  );

  let suma = 0;

  for(
    let i=0;
    i<datosAudio.length;
    i++
  ){

    let valor =
      (datosAudio[i]-128)/128;

    suma += valor*valor;
  }

  let rms =
    Math.sqrt(
      suma/datosAudio.length
    );

  intensidad = limitar(
    (rms-0.008)*18,
    0,1
  );
}

// ========================================
// ACTIVAR
// ========================================

async function activar(){

  if(!reconocimiento)return;

  escuchando = true;
  ultimaPalabra = "";

  try{

    await activarAudio();

    reconocimiento.start();

    nucleo.classList.add("activo");

    nucleo.setAttribute(
      "aria-pressed","true"
    );

  }catch(error){

    console.error(error);
    detener();
  }
}

// ========================================
// DETENER
// ========================================

function detener(){

  escuchando = false;

  nucleo.classList.remove("activo");

  nucleo.setAttribute(
    "aria-pressed","false"
  );

  if(reconocimiento){

    try{
      reconocimiento.stop();
    }catch(error){}
  }

  if(flujo){

    flujo.getTracks().forEach(
      track => track.stop()
    );

    flujo = null;
  }

  if(audioContext){

    audioContext.close();
    audioContext = null;
  }

  analizador = null;
  intensidad = 0;
}

// ========================================
// BOTÓN CENTRAL
// ========================================

nucleo.onclick = function(){

  if(escuchando){
    detener();
  }else{
    activar();
  }
};

// ========================================
// DIBUJAR NEURONAS
// ========================================

function dibujarNeuronas(dt){

  let suavizado =
    1-Math.exp(
      -dt*VELOCIDAD_TRANSICION
    );

  for(let neurona of neuronas){

    // Animar diámetro
    neurona.diametroActual +=
      (
        neurona.diametro -
        neurona.diametroActual
      ) * suavizado;

    // Animar color
    neurona.activacionActual +=
      (
        neurona.activacion -
        neurona.activacionActual
      ) * suavizado;

    let radio =
      neurona.diametroActual/2;

    let activacion =
      neurona.activacionActual;

    // Blanco -> azul
    let rojo = Math.round(
      255-(255-22)*activacion
    );

    let verde = Math.round(
      255-(255-139)*activacion
    );

    let azul = 255;

    ctx.beginPath();

    ctx.arc(
      neurona.x,
      neurona.y,
      radio,
      0,
      TAU
    );

    ctx.fillStyle =
      `rgb(${rojo},${verde},${azul})`;

    ctx.fill();
  }
}

// ========================================
// NÚCLEO 2D REACTIVO
// ========================================

function dibujarNucleo(){

  let escala =
    1+intensidadSuave*1.8;

  nucleo.style.transform =
    `scale(${escala})`;
}

// ========================================
// ANIMACIÓN
// ========================================

function animar(timestamp){

  let dt = ultimoFrame
    ?Math.min(
      (timestamp-ultimoFrame)/1000,
      0.05
    )
    :1/60;

  ultimoFrame = timestamp;

  medirVoz();

  let suavizado =
    1-Math.exp(-dt*18);

  intensidadSuave +=
    (
      intensidad -
      intensidadSuave
    )*suavizado;

  // Fondo negro puro
  ctx.fillStyle = "#000";

  ctx.fillRect(
    0,0,W,H
  );

  dibujarNeuronas(dt);
  dibujarNucleo();

  requestAnimationFrame(animar);
}

// ========================================
// INICIALIZACIÓN
// ========================================

addEventListener(
  "resize",
  ajustar
);

ajustar();

crearNeuronas(
  NUM_NEURONAS_INICIALES
);

requestAnimationFrame(
  animar
);

</script>

</body>
</html>
