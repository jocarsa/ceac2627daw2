
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxia neuronal</title>
<style>
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:#000;
}
canvas{display:block;width:100%;height:100%}
#nucleo{
  position:fixed;
  left:50%;top:50%;
  width:82px;height:82px;
  margin:-41px;
  border:1px solid rgba(180,220,255,.7);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,
    #fff 0%,#b9e8ff 16%,#478be9 45%,#061a4a 78%,#000 100%);
  box-shadow:
    0 0 16px #8bcaff,
    0 0 42px #176cff,
    0 0 100px rgba(0,90,255,.35),
    inset 0 0 15px #fff;
  cursor:pointer;
  z-index:5;
  transform:scale(1);
  transition:filter .25s;
}
#nucleo:hover{filter:brightness(1.4)}
#nucleo.activo{
  border-color:white;
  box-shadow:
    0 0 20px #fff,
    0 0 55px #278bff,
    0 0 130px #064cff,
    inset 0 0 22px white;
}
#nucleo:focus-visible{
  outline:2px solid white;
  outline-offset:12px;
}
</style>
</head>
<body>

<canvas id="universo"></canvas>
<button id="nucleo" aria-label="Activar voz"
  aria-pressed="false"></button>

<script>
const canvas=document.querySelector("#universo");
const ctx=canvas.getContext("2d");
const nucleo=document.querySelector("#nucleo");

const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

let W,H,cx,cy,R,dpr;
let estrellas=[];
let particulas=[];
let vectorAnterior=null;
let escuchando=false;
let reconocimiento=null;
let ultimaPalabra="";
let controlador=null;
let peticionActual=0;
let intensidad=0;
let intensidadSuave=0;
let audioContext=null;
let analizador=null;
let flujo=null;
let datosAudio=null;
let tiempo=0;
let pulsoEmbedding=0;

const ANGULO_AUREO=2.399963229728653;
const UMBRAL_CAMBIO=.1;
const TAU=Math.PI*2;

function aleatorio(a,b){
  return a+Math.random()*(b-a);
}

function ajustar(){
  W=innerWidth;
  H=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H/2;
  R=Math.min(W,H)*.43;
  crearEstrellas();
  colocarParticulas();
}

function crearEstrellas(){
  estrellas=[];
  for(let i=0;i<220;i++){
    estrellas.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:aleatorio(.25,1.2),
      fase:aleatorio(0,TAU),
      velocidad:aleatorio(.3,1.6)
    });
  }
}

function colocarParticulas(){
  let n=particulas.length;
  particulas.forEach((p,i)=>{
    p.angulo=i*ANGULO_AUREO;
    p.radio=R*Math.sqrt((i+.5)/n);
  });
}

function crearParticulas(n){
  particulas=[];
  for(let i=0;i<n;i++){
    particulas.push({
      angulo:i*ANGULO_AUREO,
      radio:R*Math.sqrt((i+.5)/n),
      valor:0,
      cambio:0,
      brillo:aleatorio(.5,1),
      fase:aleatorio(0,TAU),
      tamano:aleatorio(.7,2),
      velocidad:aleatorio(.5,1.5),
      x:0,y:0
    });
  }
}

// Partículas iniciales hasta recibir el embedding
crearParticulas(768);

// --------------------------------------
// EMBEDDINGS
// --------------------------------------

function actualizarVector(vector){
  if(particulas.length!==vector.length){
    crearParticulas(vector.length);
    vectorAnterior=null;
  }

  vector.forEach((valor,i)=>{
    let p=particulas[i];
    let anterior=vectorAnterior?.[i];
    let diferencia=anterior===undefined
      ? 0
      :Math.abs(valor-anterior);

    p.valor=valor;
    p.cambio=Math.min(diferencia/UMBRAL_CAMBIO,1);
  });

  vectorAnterior=[...vector];
  pulsoEmbedding=1;
}

async function consultarPalabra(palabra){
  palabra=palabra.toLowerCase()
    .replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");

  if(!palabra||palabra===ultimaPalabra)return;
  ultimaPalabra=palabra;

  if(controlador)controlador.abort();
  controlador=new AbortController();
  let numero=++peticionActual;

  try{
    let respuesta=await fetch(
      "007-servidor.php?palabra="+
      encodeURIComponent(palabra),
      {signal:controlador.signal}
    );
    if(!respuesta.ok)throw Error("HTTP "+respuesta.status);

    let datos=await respuesta.json();
    if(numero!==peticionActual)return;
    if(!Array.isArray(datos))return;

    let vector=datos.map(Number);
    if(!vector.length||!vector.every(Number.isFinite))return;

    actualizarVector(vector);
  }catch(e){
    if(e.name!=="AbortError")console.error(e);
  }
}

// --------------------------------------
// RECONOCIMIENTO EN TIEMPO REAL
// --------------------------------------

if(SpeechRecognition){
  reconocimiento=new SpeechRecognition();
  reconocimiento.lang="es-ES";
  reconocimiento.continuous=true;
  reconocimiento.interimResults=true;
  reconocimiento.maxAlternatives=1;

  reconocimiento.onresult=function(evento){
    let provisional="";
    let confirmado="";

    for(let i=0;i<evento.results.length;i++){
      let frase=evento.results[i][0].transcript;
      if(evento.results[i].isFinal){
        confirmado+=frase+" ";
      }else{
        provisional+=frase;
      }
    }

    let texto=(confirmado+" "+provisional).trim();
    if(!texto)return;

    let palabras=texto.split(/\s+/);
    consultarPalabra(palabras[palabras.length-1]);
  };

  reconocimiento.onerror=function(e){
    if(e.error==="not-allowed"||
       e.error==="service-not-allowed"){
      detener();
    }
    console.warn("Reconocimiento:",e.error);
  };

  reconocimiento.onend=function(){
    if(escuchando){
      try{reconocimiento.start()}catch(e){}
    }
  };
}

// --------------------------------------
// INTENSIDAD REAL DEL MICRÓFONO
// --------------------------------------

async function activarAudio(){
  flujo=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    }
  });

  audioContext=new (
    window.AudioContext||window.webkitAudioContext
  )();

  let fuente=audioContext.createMediaStreamSource(flujo);
  analizador=audioContext.createAnalyser();
  analizador.fftSize=1024;
  analizador.smoothingTimeConstant=.65;
  fuente.connect(analizador);
  datosAudio=new Uint8Array(analizador.fftSize);
}

function medirVoz(){
  if(!analizador){
    intensidad*=.9;
    return;
  }

  analizador.getByteTimeDomainData(datosAudio);
  let suma=0;
  for(let i=0;i<datosAudio.length;i++){
    let v=(datosAudio[i]-128)/128;
    suma+=v*v;
  }
  let rms=Math.sqrt(suma/datosAudio.length);
  intensidad=Math.min(1,Math.max(0,(rms-.012)*12));
}

async function activar(){
  if(!reconocimiento)return;
  escuchando=true;
  ultimaPalabra="";
  try{
    await activarAudio();
    reconocimiento.start();
    nucleo.classList.add("activo");
    nucleo.setAttribute("aria-pressed","true");
    nucleo.setAttribute("aria-label","Detener voz");
  }catch(e){
    console.error(e);
    detener();
  }
}

function detener(){
  escuchando=false;
  nucleo.classList.remove("activo");
  nucleo.setAttribute("aria-pressed","false");
  nucleo.setAttribute("aria-label","Activar voz");

  if(reconocimiento){
    try{reconocimiento.stop()}catch(e){}
  }
  if(flujo){
    flujo.getTracks().forEach(t=>t.stop());
    flujo=null;
  }
  if(audioContext){
    audioContext.close();
    audioContext=null;
  }
  analizador=null;
  intensidad=0;
}

nucleo.onclick=()=>{
  if(escuchando)detener();
  else activar();
};

// --------------------------------------
// DIBUJO GALÁCTICO
// --------------------------------------

function dibujarFondo(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);

  let halo=ctx.createRadialGradient(
    cx,cy,0,cx,cy,R*1.5
  );
  halo.addColorStop(0,"rgba(0,40,110,.15)");
  halo.addColorStop(.5,"rgba(0,15,55,.09)");
  halo.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=halo;
  ctx.fillRect(0,0,W,H);
}

function dibujarEstrellas(){
  for(let e of estrellas){
    let brillo=.35+.4*Math.sin(tiempo*e.velocidad+e.fase);
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,TAU);
    ctx.fillStyle=`rgba(175,215,255,${brillo})`;
    ctx.fill();
  }
}

function dibujarAnillos(){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(tiempo*.025);

  for(let i=0;i<4;i++){
    let radio=R*(.24+i*.23);
    ctx.beginPath();
    ctx.ellipse(0,0,radio,radio*.94,
      i*.4,0,TAU);
    ctx.strokeStyle=`rgba(35,110,255,${.07+i*.012})`;
    ctx.lineWidth=.7;
    ctx.stroke();
  }
  ctx.restore();
}

function dibujarParticulas(){
  let rotacion=tiempo*.035;
  let actividad=intensidadSuave;
  let expansion=1+actividad*.055+
    pulsoEmbedding*.025;

  // Posiciones: espiral animada
  for(let p of particulas){
    let giro=rotacion+
      Math.sin(tiempo*.15+p.radio*.015)*.025;

    let angulo=p.angulo+giro+
      (1-p.radio/R)*tiempo*.012;

    let radio=p.radio*expansion+
      Math.sin(tiempo*p.velocidad+p.fase)*2.5;

    p.x=cx+Math.cos(angulo)*radio;
    p.y=cy+Math.sin(angulo)*radio;
  }

  // Conexiones sutiles entre partículas próximas
  ctx.save();
  ctx.lineWidth=.45;
  let limite=Math.min(particulas.length,450);
  for(let i=0;i<limite;i+=2){
    let a=particulas[i];
    let b=particulas[(i+13)%particulas.length];
    let dx=a.x-b.x,dy=a.y-b.y;
    let d2=dx*dx+dy*dy;
    if(d2<4500){
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(30,110,255,${.08+
        .16*(1-d2/4500)*pulsoEmbedding})`;
      ctx.stroke();
    }
  }
  ctx.restore();

  // Esferas luminosas
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  for(let p of particulas){
    let energia=Math.min(1,p.cambio);
    let brillo=p.brillo*
      (.65+.35*Math.sin(tiempo*1.5+p.fase));

    let radio=Math.max(.6,
      p.tamano+
      Math.abs(p.valor)*7+
      energia*1.8+
      actividad*.6);

    let azul=Math.round(180+energia*75);
    let blanco=energia>.55;

    let color=blanco
      ?`rgba(220,240,255,${brillo})`
      :`rgba(65,${azul},255,${brillo})`;

    ctx.shadowBlur=radio*5+energia*12;
    ctx.shadowColor=energia>.4
      ?"rgba(65,160,255,.95)"
      :"rgba(30,100,255,.65)";

    ctx.beginPath();
    ctx.arc(p.x,p.y,radio,0,TAU);
    ctx.fillStyle=color;
    ctx.fill();

    // Centro blanco de las estrellas más intensas
    if(radio>2.6){
      ctx.shadowBlur=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,radio*.35,0,TAU);
      ctx.fillStyle="rgba(255,255,255,.85)";
      ctx.fill();
    }
  }

  ctx.restore();
}

function dibujarNucleo(){
  let actividad=intensidadSuave;
  let pulso=Math.sin(tiempo*2)*.025;
  let escala=1+actividad*1.15+pulso;

  nucleo.style.transform=`scale(${escala})`;

  // Ondas luminosas por intensidad de voz
  ctx.save();
  ctx.translate(cx,cy);

  for(let i=0;i<3;i++){
    let r=55+i*18+actividad*45;
    ctx.beginPath();
    ctx.arc(0,0,r,0,TAU);
    ctx.lineWidth=1+actividad*1.5;
    ctx.strokeStyle=`rgba(60,155,255,${
      (.15-i*.035)+actividad*.2
    })`;
    ctx.shadowBlur=15;
    ctx.shadowColor="#247bff";
    ctx.stroke();
  }
  ctx.restore();
}

function animar(timestamp){
  tiempo=timestamp*.001;

  medirVoz();
  intensidadSuave+=(intensidad-intensidadSuave)*.22;
  pulsoEmbedding*=.94;

  dibujarFondo();
  dibujarEstrellas();
  dibujarAnillos();
  dibujarParticulas();
  dibujarNucleo();

  requestAnimationFrame(animar);
}

addEventListener("resize",ajustar);
ajustar();
requestAnimationFrame(animar);
</script>
</body>
</html>
