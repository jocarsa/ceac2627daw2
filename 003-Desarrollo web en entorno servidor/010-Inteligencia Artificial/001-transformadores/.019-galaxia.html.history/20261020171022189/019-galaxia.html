
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa neuronal semántico 2D</title>

<style>
*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#nucleo{
  position:fixed;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  margin:-35px;
  padding:0;
  border:2px solid #65baff;
  border-radius:50%;
  background:#0755c8;
  cursor:pointer;
  z-index:5;
  transform:scale(1);
  will-change:transform;
}

#nucleo.activo{
  background:#d9f2ff;
  border-color:white;
}

#reiniciar{
  position:fixed;
  top:24px;
  right:24px;
  width:46px;
  height:46px;
  border:1px solid #29466a;
  border-radius:50%;
  background:#071324;
  color:#9bcfff;
  font-size:25px;
  cursor:pointer;
  z-index:10;
  transition:.2s;
}

#reiniciar:hover{
  background:#12498d;
  border-color:#69baff;
  color:white;
}

#nucleo:focus-visible,
#reiniciar:focus-visible{
  outline:2px solid white;
  outline-offset:5px;
}
</style>
</head>

<body>

<canvas id="universo"></canvas>

<button
  id="nucleo"
  aria-label="Activar reconocimiento de voz"
  aria-pressed="false">
</button>

<button
  id="reiniciar"
  aria-label="Reiniciar dictado"
  title="Reiniciar dictado">↻</button>

<script>

// ========================================
// CONFIGURACIÓN
// ========================================

const EXAGERACION_ESCALA=350;
const DIAMETRO_MAXIMO=70;
const DIAMETRO_MINIMO=2;

const UMBRAL_CAMBIO=.1;
const VELOCIDAD_TRANSICION=20;
const NUM_NEURONAS_INICIALES=768;

const TAU=Math.PI*2;
const ANGULO_AUREO=2.399963229728653;

const canvas=document.querySelector("#universo");
const ctx=canvas.getContext("2d",{alpha:false});

const nucleo=document.querySelector("#nucleo");
const reiniciar=document.querySelector("#reiniciar");

const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

let W,H,cx,cy,R,dpr;
let neuronas=[];

let vectorAnterior=null;

// Texto confirmado en sesiones anteriores
let textoAcumulado="";

// Texto de la sesión actual
let textoSesion="";

// Último texto enviado al servidor
let ultimoTextoConsultado="";

let peticionActual=0;
let controlador=null;

let escuchando=false;
let reconocimiento=null;
let reiniciando=false;

let intensidad=0;
let intensidadSuave=0;

let audioContext=null;
let analizador=null;
let flujo=null;
let datosAudio=null;

let ultimoFrame=0;

// ========================================
// UTILIDADES
// ========================================

function limitar(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function normalizarTexto(texto){
  return texto
    .replace(/\s+/g," ")
    .trim();
}

// ========================================
// CANVAS
// ========================================

function ajustar(){
  W=innerWidth;
  H=innerHeight;

  dpr=Math.min(devicePixelRatio||1,1.5);

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  cx=W/2;
  cy=H/2;
  R=Math.min(W,H)*.43;

  colocarNeuronas();
}

function crearNeuronas(total){
  neuronas=[];

  for(let i=0;i<total;i++){
    neuronas.push({
      x:0,
      y:0,
      valor:0,
      cambio:0,
      diametro:DIAMETRO_MINIMO,
      diametroActual:DIAMETRO_MINIMO,
      activacion:0,
      activacionActual:0
    });
  }

  colocarNeuronas();
}

function colocarNeuronas(){
  let total=neuronas.length;
  if(!total)return;

  neuronas.forEach((n,i)=>{
    let angulo=i*ANGULO_AUREO;
    let radio=R*Math.sqrt((i+.5)/total);

    n.x=cx+Math.cos(angulo)*radio;
    n.y=cy+Math.sin(angulo)*radio;
  });
}

// ========================================
// ACTUALIZAR VECTOR
// ========================================

function actualizarVector(vector){

  if(neuronas.length!==vector.length){
    crearNeuronas(vector.length);
    vectorAnterior=null;
  }

  vector.forEach((valor,i)=>{
    let n=neuronas[i];
    let anterior=vectorAnterior?.[i];

    let diferencia=anterior===undefined
      ?0
      :Math.abs(valor-anterior);

    let cambio=limitar(
      diferencia/UMBRAL_CAMBIO,0,1
    );

    n.valor=valor;
    n.cambio=cambio;

    n.diametro=limitar(
      DIAMETRO_MINIMO+
      Math.abs(valor)*EXAGERACION_ESCALA+
      cambio*25,
      DIAMETRO_MINIMO,
      DIAMETRO_MAXIMO
    );

    n.activacion=cambio;
  });

  vectorAnterior=[...vector];
}

// ========================================
// CONSULTAR TEXTO COMPLETO
// ========================================

async function consultarTexto(texto){

  texto=normalizarTexto(texto);

  if(!texto)return;

  if(texto===ultimoTextoConsultado)return;

  ultimoTextoConsultado=texto;

  if(controlador){
    controlador.abort();
  }

  controlador=new AbortController();

  let numero=++peticionActual;

  try{

    let respuesta=await fetch(
      "007-servidor.php?palabra="+
      encodeURIComponent(texto),
      {signal:controlador.signal}
    );

    if(!respuesta.ok){
      throw Error("HTTP "+respuesta.status);
    }

    let datos=await respuesta.json();

    if(numero!==peticionActual)return;
    if(!Array.isArray(datos))return;

    let vector=datos.map(Number);

    if(
      !vector.length||
      !vector.every(Number.isFinite)
    )return;

    actualizarVector(vector);

  }catch(error){
    if(error.name!=="AbortError"){
      console.error(error);
    }
  }
}

// ========================================
// RECONOCIMIENTO
// ========================================

if(SpeechRecognition){

  reconocimiento=new SpeechRecognition();

  reconocimiento.lang="es-ES";
  reconocimiento.continuous=true;
  reconocimiento.interimResults=true;
  reconocimiento.maxAlternatives=1;

  reconocimiento.onresult=function(evento){

    let confirmado="";
    let provisional="";

    for(let i=0;i<evento.results.length;i++){
      let frase=evento.results[i][0].transcript;

      if(evento.results[i].isFinal){
        confirmado+=frase+" ";
      }else{
        provisional+=frase;
      }
    }

    // El texto completo de la sesión incluye
    // también las palabras provisionales.
    textoSesion=normalizarTexto(
      confirmado+" "+provisional
    );

    let textoCompleto=normalizarTexto(
      textoAcumulado+" "+textoSesion
    );

    // Enviar el contexto completo, sin esperar
    // al resultado final del reconocimiento.
    consultarTexto(textoCompleto);
  };

  reconocimiento.onerror=function(evento){
    console.warn(evento.error);

    if(
      evento.error==="not-allowed"||
      evento.error==="service-not-allowed"
    ){
      detener();
    }
  };

  reconocimiento.onend=function(){

    // Conservar el texto antes de reiniciar
    // la sesión del reconocimiento.
    textoAcumulado=normalizarTexto(
      textoAcumulado+" "+textoSesion
    );

    textoSesion="";

    if(escuchando){
      try{
        reconocimiento.start();
      }catch(error){
        console.error(error);
      }
    }
  };
}

// ========================================
// MICRÓFONO
// ========================================

async function activarAudio(){

  flujo=await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    }
  });

  audioContext=new (
    window.AudioContext||
    window.webkitAudioContext
  )();

  let fuente=audioContext.createMediaStreamSource(flujo);

  analizador=audioContext.createAnalyser();
  analizador.fftSize=512;
  analizador.smoothingTimeConstant=.5;

  fuente.connect(analizador);

  datosAudio=new Uint8Array(analizador.fftSize);
}

function medirVoz(){

  if(!analizador){
    intensidad=0;
    return;
  }

  analizador.getByteTimeDomainData(datosAudio);

  let suma=0;

  for(let i=0;i<datosAudio.length;i++){
    let v=(datosAudio[i]-128)/128;
    suma+=v*v;
  }

  let rms=Math.sqrt(suma/datosAudio.length);

  intensidad=limitar((rms-.008)*18,0,1);
}

// ========================================
// ACTIVAR Y DETENER
// ========================================

async function activar(){

  if(!reconocimiento)return;

  escuchando=true;

  try{
    await activarAudio();
    reconocimiento.start();

    nucleo.classList.add("activo");
    nucleo.setAttribute("aria-pressed","true");

  }catch(error){
    console.error(error);
    detener();
  }
}

function detener(){

  escuchando=false;

  nucleo.classList.remove("activo");
  nucleo.setAttribute("aria-pressed","false");

  if(reconocimiento){
    try{reconocimiento.stop()}catch(error){}
  }

  if(flujo){
    flujo.getTracks().forEach(t=>t.stop());
    flujo=null;
  }

  if(audioContext){
    audioContext.close();
    audioContext=null;
  }

  analizador=null;
  intensidad=0;
}

nucleo.onclick=function(){
  if(escuchando)detener();
  else activar();
};

// ========================================
// REINICIAR TODO EL CONTEXTO
// ========================================

reiniciar.onclick=function(){

  // Invalidar peticiones pendientes
  peticionActual++;

  if(controlador){
    controlador.abort();
    controlador=null;
  }

  textoAcumulado="";
  textoSesion="";
  ultimoTextoConsultado="";

  vectorAnterior=null;

  // Volver al estado inicial
  neuronas.forEach(n=>{
    n.valor=0;
    n.cambio=0;
    n.diametro=DIAMETRO_MINIMO;
    n.diametroActual=DIAMETRO_MINIMO;
    n.activacion=0;
    n.activacionActual=0;
  });

  // Reiniciar reconocimiento sin apagar
  // el micrófono.
  if(escuchando){
    reiniciando=true;
    reconocimiento.abort();
  }
};

// ========================================
// DIBUJAR NEURONAS 2D
// ========================================

function dibujarNeuronas(dt){

  let suavizado=
    1-Math.exp(-dt*VELOCIDAD_TRANSICION);

  for(let n of neuronas){

    n.diametroActual+=
      (n.diametro-n.diametroActual)*suavizado;

    n.activacionActual+=
      (n.activacion-n.activacionActual)*suavizado;

    let activacion=n.activacionActual;

    let rojo=Math.round(
      255-(255-22)*activacion
    );

    let verde=Math.round(
      255-(255-139)*activacion
    );

    ctx.beginPath();
    ctx.arc(
      n.x,n.y,
      n.diametroActual/2,
      0,TAU
    );

    ctx.fillStyle=
      `rgb(${rojo},${verde},255)`;

    ctx.fill();
  }
}

// ========================================
// NÚCLEO CENTRAL
// ========================================

function dibujarNucleo(){
  let escala=1+intensidadSuave*1.8;
  nucleo.style.transform=`scale(${escala})`;
}

// ========================================
// ANIMACIÓN
// ========================================

function animar(timestamp){

  let dt=ultimoFrame
    ?Math.min((timestamp-ultimoFrame)/1000,.05)
    :1/60;

  ultimoFrame=timestamp;

  medirVoz();

  let suavizado=1-Math.exp(-dt*18);

  intensidadSuave+=
    (intensidad-intensidadSuave)*suavizado;

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);

  dibujarNeuronas(dt);
  dibujarNucleo();

  requestAnimationFrame(animar);
}

// ========================================
// INICIO
// ========================================

addEventListener("resize",ajustar);

ajustar();
crearNeuronas(NUM_NEURONAS_INICIALES);
requestAnimationFrame(animar);

</script>
</body>
</html>
