<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jocarsa | clasificador documental</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#29334a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e4e8f1;padding:20px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:0}h1 span{color:#5264a0}.tag{background:#fff1dc;color:#9a5b13;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;min-height:calc(100vh - 83px)}.panel{background:white;border:1px solid #e4e8f1;border-radius:16px;padding:22px;min-width:0;box-shadow:0 4px 18px #22304d08}h2{font-size:17px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5f7fb;border-radius:10px;padding:14px}.stat b{display:block;font-size:24px;color:#4f5d95}.stat small{color:#7d8596}.progress{height:12px;background:#e8ebf4;border-radius:12px;overflow:hidden;margin:17px 0 8px}.bar{height:100%;width:0;background:#4f5d95;transition:width .3s}.between{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#6d778b;font-size:13px}.buttons{display:flex;gap:9px;margin:18px 0}button{border:0;border-radius:8px;padding:10px 16px;background:#4f5d95;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e9ecf5;color:#4f5d95}.current{background:#f6f8fc;border-radius:9px;padding:12px;font-size:13px;overflow-wrap:anywhere}.scroll{max-height:calc(100vh - 400px);overflow:auto;margin-top:16px}.item{padding:12px 5px;border-bottom:1px solid #edf0f6}.item strong{font-size:13px;display:block;overflow-wrap:anywhere}.item small{color:#8991a1}.item p{font-size:12px;color:#667187;line-height:1.5;margin:6px 0}.tree{height:calc(100vh - 180px);overflow:auto}.folder{margin:7px 0 7px 14px}summary{cursor:pointer;padding:8px 5px;font-size:14px;user-select:none}summary:hover{background:#f6f7fb;border-radius:7px}.file{padding:7px 8px 7px 22px;color:#59647c;font-size:13px;overflow-wrap:anywhere;cursor:help}.file:hover{background:#f6f7fb}.count{color:#8991a1;font-size:12px}.empty{padding:30px;text-align:center;color:#929aac;font-size:14px}@media(max-width:850px){.layout{grid-template-columns:1fr}.tree{height:450px}.scroll{max-height:350px}}
</style></head><body><header><h1>jocarsa <span>| clasificador documental</span></h1><div class="tag">● MODO SIMULACIÓN · SIN MOVER ARCHIVOS</div></header><main class="layout"><section class="panel"><h2>Procesamiento de documentos</h2><div class="stats"><div class="stat"><b id="total">0</b><small>Encontrados</small></div><div class="stat"><b id="done">0</b><small>Revisados</small></div><div class="stat"><b id="classified">0</b><small>Clasificados</small></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="between"><span id="message">Preparado</span><strong id="percent">0%</strong></div><div class="buttons"><button id="start" onclick="action('start')">▶ Iniciar / Reanudar</button><button class="secondary" id="stop" onclick="action('stop')">■ Detener</button></div><div class="current"><b>Documento actual:</b> <span id="current">Ninguno</span></div><div class="between" style="margin-top:18px"><b>Documentos clasificados</b><span id="errors">0 errores</span></div><div class="scroll" id="records"></div></section><section class="panel"><div class="between"><h2>Carpetas simuladas</h2><span id="foldercount"></span></div><div class="tree" id="tree"><div class="empty">Las carpetas aparecerán al clasificar los documentos.</div></div></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lastTree='',lastRecords='';
async function action(name){try{let r=await fetch('/api/'+name,{method:'POST'});if(!r.ok)throw Error((await r.json()).message);await refresh()}catch(e){alert(e.message)}}
async function refresh(){try{let d=await(await fetch('/api/status')).json();$('total').textContent=d.total;$('done').textContent=d.done;$('classified').textContent=d.classified;$('errors').textContent=d.errors+' errores';$('message').textContent=d.message;$('current').textContent=d.current||'Ninguno';$('percent').textContent=d.percentage+'%';$('bar').style.width=d.percentage+'%';$('start').disabled=d.running;$('stop').disabled=!d.running;
let recKey=JSON.stringify(d.records);if(recKey!==lastRecords){lastRecords=recKey;$('records').innerHTML=d.records.length?d.records.map(r=>`<div class="item"><strong>📄 ${esc(r.archivo)}</strong><small>${esc(r.categoria)} / ${esc(r.subcategoria)}</small><p>${esc(r.resumen)}</p></div>`).join(''):'<div class="empty">Sin documentos clasificados todavía.</div>'}
let treeKey=JSON.stringify(d.tree);if(treeKey!==lastTree){lastTree=treeKey;let open=new Set([...document.querySelectorAll('details[open]')].map(x=>x.dataset.key));let categories=Object.entries(d.tree);$('foldercount').textContent=categories.length+' categorías';$('tree').innerHTML=categories.length?categories.sort((a,b)=>a[0].localeCompare(b[0])).map(([cat,subs])=>{let n=Object.values(subs).reduce((a,v)=>a+v.length,0);return `<details class="folder" data-key="${esc(cat)}" ${open.has(cat)?'open':''}><summary>📁 ${esc(cat)} <span class="count">(${n})</span></summary>${Object.entries(subs).sort((a,b)=>a[0].localeCompare(b[0])).map(([sub,files])=>{let key=cat+'/'+sub;return `<details class="folder" data-key="${esc(key)}" ${open.has(key)?'open':''}><summary>📂 ${esc(sub)} <span class="count">(${files.length})</span></summary>${files.map(f=>`<div class="file" title="${esc(f.ruta+'\n\n'+f.resumen)}">📄 ${esc(f.archivo)}</div>`).join('')}</details>`}).join('')}</details>`}).join(''):'<div class="empty">Las carpetas aparecerán al clasificar los documentos.</div>'}
}catch(e){$('message').textContent='No se puede conectar con Flask: '+e.message}}
refresh();setInterval(refresh,1500);
</script></body></html>
