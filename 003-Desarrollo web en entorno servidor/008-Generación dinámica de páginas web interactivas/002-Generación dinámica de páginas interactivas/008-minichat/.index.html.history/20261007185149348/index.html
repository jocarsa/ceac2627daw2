<!doctype html>
<html>
  <head>
    <style>
      html,body{width:100%;height:100%;padding:0px;margin:0px;}
      p{padding:0px;margin:0px;}
      body{display:flex;background:grey;justify-content:center;align-items:center;}
      #login{
        width:200px;height:200px;padding:20px;background:white;
      	display:flex;flex-direction:column;justify-content:center;
        gap:10px;
      }
      #chat{
        display:none;
        width:400px;
        height:600px;
        padding:20px;
        background:white;
        flex-direction:column;
        gap:10px;
        border-radius:10px;
        box-shadow:0px 10px 30px rgba(0,0,0,0.2);
      }

      #chat main{
        flex:1;
        background:#f2f2f2;
        padding:15px;
        border-radius:8px;
        overflow-y:auto;
        display:flex;
        flex-direction:column;
        gap:10px;
      }

      #chat article{
        background:turquoise;
        padding:10px 15px;
        border-radius:15px 15px 15px 3px;
        max-width:75%;
        width:max-content;
        font-family:sans-serif;
        font-size:14px;
        box-shadow:0px 2px 5px rgba(0,0,0,0.1);
      }

      #chat nav{
        display:flex;
        width:100%;
      }

      #chat nav input{
        width:100%;
        padding:12px 15px;
        border:1px solid #ccc;
        border-radius:20px;
        outline:none;
        font-size:14px;
      }

      #chat nav input:focus{
        border-color:turquoise;
        box-shadow:0 0 0 3px rgba(64,224,208,0.2);
      }
    </style>
  </head>
  <body>
    <div id="login">
      <h3>Turquesa</h3>
      <p>Introduce tu nombre</p>
      <input type="text" id="usuario">
      <button id="entrar">Entrar</button>
      <script>
        let boton = document.querySelector("#entrar")
        boton.onclick = function(){
          let entrada = document.querySelector("#usuario")
          localStorage.setItem("usuario",entrada.value)
        	document.querySelector("#login").style.display = "none"
          document.querySelector("#chat").style.display = "flex"
        }
        let temporizador = setTimeout("bucle()",1000)
        
        function bucle(){
          fetch("servidor.php?accion=get")
          .then(function(resultado){ return resultado.json()})
          .then(function(datos){
          	// Primero vacio main
            let principal = document.querySelector("main")
            principal.innerHTML = ""
            datos.forEach(function(mensaje){
            	let articulo = document.createElement("article")
              let fecha = document.createElement("time")
              fecha.textContent = mensaje.fecha
              let usuario = document.createElement("p")
              usuario.textContent = mensaje.usuario
              let texto = document.createElement("p")
              texto.textContent = mensaje.mensaje
              articulo.appendChild(fecha)
              articulo.appendChild(usuario)
              articulo.appendChild(texto)
              principal.appendChild(articulo)
            })
          })
        	clearTimeout(temporizador)
          temporizador = setTimeout("bucle()",1000)
        }
        
      </script>
    </div>
    <div id="chat">
      <main>
        <article>mensaje</article>
      </main>
      <nav>
        <input type="text" id="mensaje">
      </nav>
    </div>
    <script>
      let inputmensaje = document.querySelector("#mensaje")
        inputmensaje.onkeyup = function(e){
        	console.log(e)
          if(e.code == "Enter"){
          	
          }
        }
    </script>
    
  </body>
</html>
