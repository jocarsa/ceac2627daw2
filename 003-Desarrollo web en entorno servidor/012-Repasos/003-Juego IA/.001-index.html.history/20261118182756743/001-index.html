<!doctype html>
<html>
  <head>
  </head>
  <body>
    <canvas></canvas>
    <script>
      let lienzo = document.querySelector("canvas")
      lienzo.width= 512;
      lienzo.height=512;
      let contexto = lienzo.getContext("2d")
      let sprite = new Image()
      sprite.src = "sprite.png"
      sprite.onload = function(){
      	contexto.drawImage(sprite,40,40,16,16)
      }
      
    </script>
  </body>
</html>
