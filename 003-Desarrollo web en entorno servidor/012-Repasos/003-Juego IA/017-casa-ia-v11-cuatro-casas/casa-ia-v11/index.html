<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa IA · Cuatro casas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#1c1d20;color:#eee;font-family:system-ui,sans-serif}
main{width:min(100%,1150px);margin:auto;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.casa{min-width:0;background:#292a30;border:3px solid #101010;border-radius:5px;overflow:hidden}
.casa header{height:29px;padding:5px 12px;font-size:13px;color:#c9c9cc;background:#292a30}
iframe{display:block;width:100%;aspect-ratio:1;border:0;background:#29241e}
@media(max-width:650px){main{grid-template-columns:1fr}}
</style></head><body><main>
<section class="casa"><header>Casa 1</header><iframe src="/casa/1" title="Casa 1"></iframe></section>
<section class="casa"><header>Casa 2</header><iframe src="/casa/2" title="Casa 2"></iframe></section>
<section class="casa"><header>Casa 3</header><iframe src="/casa/3" title="Casa 3"></iframe></section>
<section class="casa"><header>Casa 4</header><iframe src="/casa/4" title="Casa 4"></iframe></section>
</main></body></html>
