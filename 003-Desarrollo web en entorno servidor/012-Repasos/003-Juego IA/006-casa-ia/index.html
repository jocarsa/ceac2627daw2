<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa IA · Simulador</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1c1d20;color:#e9e9eb;font:14px system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.layout{display:grid;grid-template-columns:minmax(320px,640px) 260px;gap:20px;align-items:start}canvas{display:block;width:100%;image-rendering:pixelated;border:5px solid #101010;background:#29241e}aside{background:#292a30;border:1px solid #44454b;border-radius:12px;padding:18px}h2{margin:0 0 12px;font-size:18px}p{line-height:1.5}button{background:#45474f;color:white;border:1px solid #777;border-radius:7px;padding:8px 12px;cursor:pointer;margin:3px 2px 6px 0}.meter{margin:12px 0}.meter label{display:flex;justify-content:space-between;margin-bottom:5px}.track{height:10px;background:#161719;border-radius:5px;overflow:hidden}.fill{height:100%;width:0}.muted{color:#aeb0b8;font-size:12px}#status{min-height:65px;overflow-wrap:anywhere}@media(max-width:850px){.layout{grid-template-columns:minmax(280px,512px)}aside{max-width:512px}}</style></head><body>
<div class="layout"><canvas id="juego" width="512" height="512"></canvas><aside><h2>Casa · IA local</h2><p class="muted">WASD o flechas: movimiento manual. IA: piloto automático.</p><button id="modo">IA: activada</button><button id="colisiones">Colisiones: sí</button><button id="decidir">Decidir ahora</button><div id="medidores"></div><p id="status">Conectando con Ollama…</p><p class="muted" id="habitacion"></p><p class="muted">Azul: sed · Verde: pipí · Amarillo: cansancio · Morado: aburrimiento. Las barras se llenan al aumentar la necesidad.</p></aside></div>
<script>
'use strict';
const canvas=document.getElementById('juego'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const TILE=32,STEP=8;
// 16x16. Puertas de dos casillas: salón/cocina, salón/dormitorio, cocina/baño y dormitorio/baño.
const map=[
'################',
'#.......#cccccc#',
'#.......#cccccc#',
'#.......#cccccc#',
'#........cccccc#',
'#........cccccc#',
'#.......#cccccc#',
'#.......#cccccc#',
'####..######..##',
'#ddddddd#bbbbbb#',
'#ddddddd#bbbbbb#',
'#ddddddd#bbbbbb#',
'#dddddd..bbbbbb#',
'#dddddd..bbbbbb#',
'#ddddddd#bbbbbb#',
'################'];
if(map.length!==16||map.some(r=>r.length!==16))throw Error('Mapa inválido');
const rooms={salon:'.',cocina:'c',dormitorio:'d',bano:'b'};
const roomNames={'.':'Salón',c:'Cocina',d:'Dormitorio',b:'Baño','#':'Pared'};
const colors={sed:'#39b9ed',pipi:'#6bd775',cansancio:'#f2c34e',aburrimiento:'#c38aed'};
const furniture=[];
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function box(x,y,w,h,c){rect(x+3,y+4,w,h,'#46352c');rect(x,y,w,h,c);rect(x+2,y+2,w-4,3,'#ffffff29');rect(x+2,y+h-4,w-4,2,'#00000033')}
function add(x,y,w,h,draw){furniture.push({x,y,w,h,draw})}
// Muebles con colisiones reales y pasillos despejados.
add(45,55,75,29,()=>{box(45,55,75,29,'#914e47');rect(54,60,57,8,'#c47967');rect(54,70,57,9,'#ad6356')});
add(65,115,49,31,()=>{box(65,115,49,31,'#865c38');rect(71,120,37,20,'#c08b52')});
add(176,53,39,20,()=>{box(176,53,39,20,'#393c43');rect(181,57,29,12,'#42838e')});
add(302,42,40,35,()=>{box(302,42,40,35,'#b6bcb9');rect(307,47,30,24,'#e7e9e5');rect(311,55,2,10,'#7c8080')});
add(353,43,91,30,()=>{box(353,43,91,30,'#b78b5e');rect(360,48,76,19,'#d9c9aa');for(let i=0;i<4;i++)rect(369+i*17,53,11,9,'#45474a')});
add(354,132,62,33,()=>{box(354,132,62,33,'#9b7047');rect(360,137,50,22,'#d0a372')});
add(332,136,15,23,()=>box(332,136,15,23,'#795b40'));
add(423,136,15,23,()=>box(423,136,15,23,'#795b40'));
add(44,331,65,89,()=>{box(44,331,65,89,'#815b43');rect(49,337,55,76,'#e7dcc4');rect(52,341,49,15,'#fff7e9');rect(49,360,55,53,'#638ea3');rect(49,406,55,7,'#456a84')});
add(170,341,45,48,()=>{box(170,341,45,48,'#8c603a');rect(176,347,33,35,'#ac8253');rect(191,357,3,7,'#efca78')});
add(145,418,35,27,()=>box(145,418,35,27,'#95683d'));
add(336,331,94,44,()=>{box(336,331,94,44,'#dce6e4');rect(342,337,82,31,'#f5f8f5');rect(350,342,66,20,'#8cbcc7')});
add(450,342,28,35,()=>{box(450,342,28,35,'#e6e9e7');rect(454,348,20,17,'#fff');rect(458,352,12,10,'#a8d0d6')});
add(343,419,43,30,()=>{box(343,419,43,30,'#bea38c');rect(348,423,33,19,'#f2f5f4');rect(354,427,21,11,'#9ec5cc')});
function collide(x,y,w,h){if(!state.collisions)return false;if(x<0||y<0||x+w>512||y+h>512)return true;for(let r=Math.floor(y/TILE);r<=Math.floor((y+h-.01)/TILE);r++)for(let c=Math.floor(x/TILE);c<=Math.floor((x+w-.01)/TILE);c++)if(map[r]?.[c]==='#'||map[r]?.[c]===undefined)return true;return furniture.some(m=>x<m.x+m.w&&x+w>m.x&&y<m.y+m.h&&y+h>m.y)}
class Personaje{
 constructor(x,y){this.x=x;this.y=y;this.ancho=24;this.alto=24;this.velocidad=120;this.sed=35;this.pipi=15;this.cansancio=30;this.aburrimiento=45;this.incrementos={sed:1.5,pipi:1.1,cansancio:.8,aburrimiento:1.3};this.recuperacion=16}
 room(){return map[Math.floor((this.y+12)/32)]?.[Math.floor((this.x+12)/32)]||'#'}
 mover(dx,dy){if(!collide(this.x+dx,this.y,24,24))this.x+=dx;if(!collide(this.x,this.y+dy,24,24))this.y+=dy}
 updateNeeds(dt){for(const key of Object.keys(this.incrementos))this[key]+=this.incrementos[key]*dt;const r=this.room();const recover={'.':'aburrimiento',c:'sed',d:'cansancio',b:'pipi'}[r];if(recover)this[recover]-=this.recuperacion*dt;for(const key of Object.keys(this.incrementos))this[key]=Math.max(0,Math.min(100,this[key]))}
 draw(){if(sprite.complete&&sprite.naturalWidth)ctx.drawImage(sprite,Math.round(this.x-4),Math.round(this.y-8),32,32);else{rect(this.x+4,this.y,16,10,'#4e3228');rect(this.x+5,this.y+8,14,10,'#efbf91');rect(this.x+3,this.y+18,18,8,'#417cae');rect(this.x+4,this.y+25,6,4,'#3a3332');rect(this.x+14,this.y+25,6,4,'#3a3332')}
 const x=Math.round(this.x-4),y=Math.round(this.y-40);Object.keys(colors).forEach((key,i)=>{rect(x-1,y+i*8-1,34,6,'#121212');rect(x,y+i*8,32,4,'#424242');rect(x,y+i*8,32*this[key]/100,4,colors[key])})}
}
const sprite=new Image();sprite.src='/sprite.png';
const player=new Personaje(145,100);
const state={ai:true,collisions:true,loading:false,destination:null,action:'',reason:'',error:'',path:[],elapsed:4.9,interval:5,requestId:0};
const keys=new Set();
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();keys.add(k)}if(k==='c'&&!e.repeat)toggleCollisions()});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
function toggleCollisions(){state.collisions=!state.collisions;state.path=[];document.getElementById('colisiones').textContent='Colisiones: '+(state.collisions?'sí':'no')}
document.getElementById('colisiones').onclick=toggleCollisions;
document.getElementById('modo').onclick=()=>{state.ai=!state.ai;state.path=[];state.elapsed=state.interval;document.getElementById('modo').textContent='IA: '+(state.ai?'activada':'desactivada');if(state.ai)decide()};
document.getElementById('decidir').onclick=()=>{state.elapsed=0;decide()};
// A*: navegación en cuadrícula de 8 píxeles, evitando paredes y muebles.
function routeTo(room){const type=rooms[room];if(!type)return [];const size=64, start={x:Math.round(player.x/STEP),y:Math.round(player.y/STEP)};const id=(x,y)=>y*size+x;const startId=id(start.x,start.y);const queue=[{...start,g:0,f:0}];const best=new Map([[startId,0]]),parent=new Map(),visited=new Set();const dirs=[[1,0],[-1,0],[0,1],[0,-1]];let end=null;
 while(queue.length){queue.sort((a,b)=>a.f-b.f);const node=queue.shift(),n=id(node.x,node.y);if(visited.has(n))continue;visited.add(n);const px=node.x*STEP,py=node.y*STEP;if(map[Math.floor((py+12)/32)]?.[Math.floor((px+12)/32)]===type&&!collide(px,py,24,24)){end=n;break}
 for(const [dx,dy] of dirs){const x=node.x+dx,y=node.y+dy;if(x<0||y<0||x>=size||y>=size||collide(x*STEP,y*STEP,24,24))continue;const k=id(x,y),g=node.g+1;if(g>=(best.get(k)??Infinity))continue;best.set(k,g);parent.set(k,n);queue.push({x,y,g,f:g})}}
 if(end===null)return [];const path=[];let k=end;while(k!==startId){path.push({x:(k%size)*STEP,y:Math.floor(k/size)*STEP});k=parent.get(k);if(k===undefined)return []}path.reverse();return path}
async function decide(){if(!state.ai||state.loading)return;state.loading=true;state.error='';try{const res=await fetch('/api/decidir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sed:player.sed,pipi:player.pipi,cansancio:player.cansancio,aburrimiento:player.aburrimiento,habitacion:roomNames[player.room()]||'desconocida',destino_actual:state.destination})});const data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'Error IA');if(!state.ai)return;state.action=data.accion;state.reason=data.motivo;const newRoom=data.destino;if(newRoom!==state.destination||(!state.path.length&&player.room()!==rooms[newRoom])){state.destination=newRoom;state.path=routeTo(newRoom);if(!state.path.length&&player.room()!==rooms[newRoom])state.error='No existe ruta transitable hasta '+newRoom}}catch(e){state.error=e.message}finally{state.loading=false;updateUI()}}
function moveAI(dt){if(!state.path.length)return;let remaining=player.velocidad*dt;while(remaining>.001&&state.path.length){const p=state.path[0],dx=p.x-player.x,dy=p.y-player.y,d=Math.hypot(dx,dy);if(d<.3){state.path.shift();continue}const step=Math.min(remaining,d,3),ox=player.x,oy=player.y;player.mover(dx/d*step,dy/d*step);const moved=Math.hypot(player.x-ox,player.y-oy);if(moved<.01){state.path=[];state.error='Ruta bloqueada';break}remaining-=moved}}
function update(dt){player.updateNeeds(dt);if(state.ai){state.elapsed+=dt;if(state.elapsed>=state.interval){state.elapsed=0;decide()}moveAI(dt)}else{let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const d=Math.hypot(dx,dy);if(d){dx/=d;dy/=d;const n=Math.ceil(player.velocidad*dt/3);for(let i=0;i<n;i++)player.mover(dx*player.velocidad*dt/n,dy*player.velocidad*dt/n)}}}
function drawMap(){for(let y=0;y<16;y++)for(let x=0;x<16;x++){const t=map[y][x],px=x*32,py=y*32;if(t==='#'){rect(px,py,32,32,'#514032');rect(px,py,32,5,'#80634b');rect(px,py+27,32,5,'#302820')}else{rect(px,py,32,32,({'.':'#bd8b57',c:'#c6b99b',d:'#b58d68',b:'#a2c7cb'})[t]);if(t==='.'||t==='d'){rect(px,py+15,32,1,'#936c48');rect(px+(y%2)*16,py,1,15,'#936c48')}else{rect(px,py,32,1,'#ffffff30');rect(px,py,1,32,'#ffffff30')}}}}
function decor(){rect(48,169,128,55,'#a65d48');rect(53,174,118,45,'#ce9471');rect(60,181,104,31,'#a65d48');rect(115,393,70,22,'#b87c64');rect(120,397,60,14,'#d5a38b');for(const [x,y] of [[189,191],[273,175]]){rect(x+5,y+12,17,13,'#9c633c');rect(x+2,y+4,22,14,'#346b3f');rect(x+8,y,14,14,'#4e9955')}rect(131,39,35,23,'#5c3c2d');rect(135,43,27,15,'#81a3a0')}
function draw(){ctx.clearRect(0,0,512,512);drawMap();decor();for(const m of furniture)m.draw();player.draw()}
const meterRoot=document.getElementById('medidores');for(const [key,label] of [['sed','Sed'],['pipi','Pipí'],['cansancio','Cansancio'],['aburrimiento','Aburrimiento']]){const div=document.createElement('div');div.className='meter';div.innerHTML=`<label>${label}<span id="v-${key}">0%</span></label><div class="track"><div class="fill" id="b-${key}" style="background:${colors[key]}"></div></div>`;meterRoot.appendChild(div)}
function updateUI(){for(const k of Object.keys(colors)){document.getElementById('v-'+k).textContent=Math.round(player[k])+'%';document.getElementById('b-'+k).style.width=player[k]+'%'}document.getElementById('habitacion').textContent='Habitación: '+(roomNames[player.room()]||'pasillo');document.getElementById('status').textContent=state.error?'Error: '+state.error:state.ai?(state.loading?'Consultando Ollama… ':'')+'Destino: '+(state.destination||'pendiente')+' · '+(state.action||'')+(state.reason?' · '+state.reason:''):'Control manual activo'}
let previous=0,uiElapsed=0;function loop(time){if(!previous)previous=time;const dt=Math.min((time-previous)/1000,.05);previous=time;update(dt);draw();uiElapsed+=dt;if(uiElapsed>.15){uiElapsed=0;updateUI()}requestAnimationFrame(loop)}updateUI();requestAnimationFrame(loop);
</script></body></html>
