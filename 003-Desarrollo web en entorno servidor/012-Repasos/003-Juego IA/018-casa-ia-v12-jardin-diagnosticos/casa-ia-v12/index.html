<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa IA v12 · Barrio</title><style>
*{box-sizing:border-box}body{margin:0;background:#191b1d;color:#e8e8e8;font:14px system-ui}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#25272a}button,input{accent-color:#9bc7aa}button{background:#42464a;border:1px solid #777;color:white;border-radius:6px;padding:6px 10px;cursor:pointer}main{display:grid;place-items:center;padding:12px}canvas{width:min(96vw,96vh,1100px);height:auto;image-rendering:pixelated;touch-action:none;cursor:grab;border:3px solid #101010}small{color:#b6babd}#status{padding:0 16px 12px;color:#b6babd}</style></head><body><header><strong>jocarsa | barrio IA</strong><span>Cuatro casas · jardín compartido</span><label>IA cada <output id="periodLabel">20</output> s <input id="period" type="range" min="3" max="120" value="20"></label><button id="download">Exportar diagnóstico JSON</button><small>Se guarda automáticamente cada 20 s · Arrastra personajes</small></header><main><canvas id="game" width="1216" height="1216"></canvas></main><div id="status">Iniciando...</div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),T=32,HOME=512,GAP=96,PAD=32,GRID=16;
ctx.imageSmoothingEnabled=false;
const houses=[{id:1,x:PAD,y:PAD},{id:2,x:PAD+HOME+GAP,y:PAD},{id:3,x:PAD,y:PAD+HOME+GAP},{id:4,x:PAD+HOME+GAP,y:PAD+HOME+GAP}];
const map=['################','#.......#cccccc#','#.......#cccccc#','#.......#cccccc#','#........cccccc#','#........cccccc#','#.......#cccccc#','#.......#cccccc#','####..######..##','#ddddddd#bbbbbb#','#ddddddd#bbbbbb#','#ddddddd#bbbbbb#','#dddddd..bbbbbb#','#dddddd..bbbbbb#','#ddddddd#bbbbbb#','################'];
// Dos puertas exteriores por casa: una superior y una inferior, cada una de dos casillas.
const tile=(h,c,r)=>((r===0||r===15)&&(c===4||c===5))?'.':map[r]?.[c]||'#';
const furniture=[];
function furnish(h,x,y,w,hh,color){furniture.push({x:h.x+x,y:h.y+y,w,h:hh,color})}
for(const h of houses){furnish(h,45,55,75,29,'#9c5b4d');furnish(h,65,115,49,31,'#9c754c');furnish(h,176,53,39,20,'#4a616b');furnish(h,302,42,40,35,'#d4d8d3');furnish(h,353,43,91,30,'#b89264');furnish(h,354,132,62,33,'#a47a4b');furnish(h,332,136,15,23,'#70513b');furnish(h,423,136,15,23,'#70513b');furnish(h,44,331,65,89,'#6c98ad');furnish(h,170,341,45,48,'#966b41');furnish(h,145,418,35,27,'#966b41');furnish(h,336,331,94,44,'#b7dce2');furnish(h,450,342,28,35,'#f3f3ed');furnish(h,343,419,43,30,'#e6eee9')}
const colors={sed:'#39b9ed',pipi:'#6bd775',cansancio:'#f2c34e',aburrimiento:'#c38aed'};
const names={'.':'salon',c:'cocina',d:'dormitorio',b:'bano',g:'jardin'};
function zone(x,y){for(const h of houses){const lx=x-h.x,ly=y-h.y;if(lx>=0&&ly>=0&&lx<HOME&&ly<HOME){const c=Math.floor(lx/T),r=Math.floor(ly/T);return {home:h.id,room:names[tile(h,c,r)]||'pared',tile:tile(h,c,r)}}}return {home:null,room:'jardin',tile:'g'}}
function free(x,y,w=24,hh=24){if(x<0||y<0||x+w>canvas.width||y+hh>canvas.height)return false;for(const [xx,yy] of [[x,y],[x+w-.1,y],[x,y+hh-.1],[x+w-.1,y+hh-.1]])if(zone(xx,yy).room==='pared')return false;return !furniture.some(m=>x<m.x+m.w&&x+w>m.x&&y<m.y+m.h&&y+hh>m.y)}
function segment(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3);for(let i=1;i<=n;i++){const t=i/n;if(!free(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false}return true}
function insideOwn(a,d,x,y){const z=zone(x+12,y+12);return d==='jardin'?z.room==='jardin':z.home===a.home&&z.room===d}
const agents=[];let interval=20,drag=null,events=[],trace=[],lastExport=performance.now(),lastSample=0;
const NEEDS=['sed','pipi','cansancio','aburrimiento'];
for(const h of houses)for(let j=0;j<2;j++){const a={id:`casa-${h.id}-agente-${j+1}`,home:h.id,name:`Vecino ${h.id}.${j+1}`,x:h.x+135+j*70,y:h.y+175+j*25,sed:25+j*10,pipi:30,cansancio:30,aburrimiento:40,goal:null,path:[],thought:'',until:0,loading:false,elapsed:j*5,wait:0,lastPos:null,lastZone:'',retry:0,dragging:false,socialCooldown:12+j*5,conversationBusy:false};agents.push(a);chooseName(a)}
function record(a,type,detail={}){const e={time:new Date().toISOString(),agent:a?.id||null,home:a?.home||null,type,...detail};events.push(e);if(events.length>4000)events.shift();if(a&&['decision','arrival','blocked','drag','dialogue'].includes(type))fetch('/api/evento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente_id:a.id,tipo:type,habitacion:zone(a.x+12,a.y+12).room,destino:a.goal||'',mensaje:JSON.stringify(detail),necesidades:Object.fromEntries(NEEDS.map(k=>[k,Math.round(a[k])]))})}).catch(()=>{})}
async function chooseName(a){try{const r=await fetch('/api/nombre',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente_id:a.id})});const d=await r.json();if(d.ok)a.name=d.nombre}catch(e){record(a,'name_error',{error:String(e)})}}
function say(a,s){a.thought=String(s||'').slice(0,110);a.until=performance.now()+9000}
// A*: cuadrícula de 16px, metas múltiples, y conexión real de inicio y final.
function route(a,d){const W=Math.ceil(canvas.width/GRID),H=Math.ceil(canvas.height/GRID),count=W*H;const start={x:a.x,y:a.y};const valid=new Uint8Array(count),goals=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x*GRID,py=y*GRID,k=y*W+x;if(free(px,py)){valid[k]=1;if(insideOwn(a,d,px,py))goals.push(k)}}if(!goals.length)return [];
const startKeys=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=y*W+x;if(valid[k]&&Math.hypot(x*GRID-a.x,y*GRID-a.y)<GRID*2&&segment(start,{x:x*GRID,y:y*GRID}))startKeys.push(k)}if(!startKeys.length)return [];
const goalSet=new Set(goals),dist=new Float64Array(count).fill(Infinity),parent=new Int32Array(count).fill(-1),closed=new Uint8Array(count),heap=[];
function push(k,cost){let i=heap.length;heap.push({k,cost});while(i){const p=(i-1)>>1;if(heap[p].cost<=cost)break;heap[i]=heap[p];i=p}heap[i]={k,cost}}
function pop(){const first=heap[0],last=heap.pop();if(heap.length){let i=0;while(true){const l=2*i+1;if(l>=heap.length)break;const r=l+1,j=r<heap.length&&heap[r].cost<heap[l].cost?r:l;if(heap[j].cost>=last.cost)break;heap[i]=heap[j];i=j}heap[i]=last}return first}
for(const k of startKeys){const x=k%W,y=(k/W)|0,c=Math.hypot(x*GRID-a.x,y*GRID-a.y);dist[k]=c;push(k,c)}let found=-1;
while(heap.length){const {k,cost}=pop();if(closed[k]||cost>dist[k]+1e-7)continue;closed[k]=1;if(goalSet.has(k)){found=k;break}const x=k%W,y=(k/W)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=ny*W+nx;if(!valid[nk]||closed[nk])continue;const nd=cost+GRID;if(nd<dist[nk]){dist[nk]=nd;parent[nk]=k;push(nk,nd)}}}
if(found<0)return [];const path=[];for(let k=found;k>=0;k=parent[k])path.push({x:(k%W)*GRID,y:((k/W)|0)*GRID});path.reverse();const compressed=[];for(let i=0;i<path.length;i++){if(i>0&&i<path.length-1){const p=path[i-1],c=path[i],n=path[i+1];if(c.x-p.x===n.x-c.x&&c.y-p.y===n.y-c.y)continue}compressed.push(path[i])}return compressed}
async function decide(a){if(a.loading||a.dragging||performance.now()<a.retry)return;a.loading=true;try{const z=zone(a.x+12,a.y+12);const r=await fetch('/api/decidir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente_id:a.id,casa_origen:a.home,habitacion:z.room,destino_actual:a.goal,sed:a.sed,pipi:a.pipi,cansancio:a.cansancio,aburrimiento:a.aburrimiento,personajes_visibles:agents.filter(b=>b!==a&&Math.hypot(b.x-a.x,b.y-a.y)<140).map(b=>b.name)})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Error IA');const goal=d.destino;if(goal!==a.goal||(!a.path.length&&!insideOwn(a,goal,a.x,a.y))){a.goal=goal;a.path=route(a,goal);a.wait=0}say(a,d.motivo||d.accion);record(a,'decision',{zone:z.room,goal,reason:d.motivo,pathLength:a.path.length,needs:Object.fromEntries(NEEDS.map(k=>[k,Math.round(a[k])]))});if(!a.path.length&&!insideOwn(a,goal,a.x,a.y))record(a,'blocked',{reason:'no_route',goal})}catch(e){a.retry=performance.now()+15000;record(a,'ai_error',{error:String(e)});say(a,'Necesito pensar un momento...')}finally{a.loading=false}}
async function converse(a,b){
 if(a.conversationBusy||b.conversationBusy)return;
 a.conversationBusy=b.conversationBusy=true;
 try{const r=await fetch('/api/dialogar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente_id:a.id,otro_id:b.id,nombre:a.name,otro_nombre:b.name,habitacion:zone(a.x+12,a.y+12).room,necesidades:Object.fromEntries(NEEDS.map(k=>[k,a[k]]))})});const d=await r.json();if(d.ok){say(a,d.mensaje);say(b,d.respuesta);record(a,'dialogue',{with:b.id,text:d.mensaje});record(b,'dialogue',{with:a.id,text:d.respuesta})}}catch(e){record(a,'dialogue_error',{error:String(e)})}finally{a.conversationBusy=b.conversationBusy=false}
}
function update(dt){
 for(const a of agents)a.socialCooldown-=dt;
 for(let i=0;i<agents.length;i++)for(let j=i+1;j<agents.length;j++){
  const a=agents[i],b=agents[j];
  if(a.socialCooldown<=0&&b.socialCooldown<=0&&!a.conversationBusy&&!b.conversationBusy&&Math.hypot(a.x-b.x,a.y-b.y)<85){
   a.socialCooldown=b.socialCooldown=30;converse(a,b);
  }
 }
 for(const a of agents){for(const k of NEEDS)a[k]=Math.min(100,a[k]+({sed:1.5,pipi:1.1,cansancio:.8,aburrimiento:1.3}[k])*dt);const z=zone(a.x+12,a.y+12),satisfied={salon:'aburrimiento',jardin:'aburrimiento',cocina:'sed',bano:'pipi',dormitorio:'cansancio'}[z.room];if(satisfied&&(z.room==='jardin'||z.home===a.home))a[satisfied]=Math.max(0,a[satisfied]-16*dt);if(z.room!==a.lastZone){if(a.lastZone)record(a,'arrival',{from:a.lastZone,to:z.room,house:z.home});a.lastZone=z.room}if(a.dragging)continue;a.elapsed+=dt;if(a.elapsed>=interval){a.elapsed=0;decide(a)}if(!a.path.length)continue;let budget=105*dt;while(budget>0.1&&a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);if(d<.6){a.path.shift();continue}const s=Math.min(budget,d,3),nx=a.x+dx/d*s,ny=a.y+dy/d*s;if(!segment({x:a.x,y:a.y},{x:nx,y:ny})){a.path=route(a,a.goal);a.wait+=dt;break}const occupied=agents.some(b=>b!==a&&!b.dragging&&Math.hypot(nx-b.x,ny-b.y)<21);if(occupied){a.wait+=dt;if(a.wait>2){a.path=route(a,a.goal);a.wait=0;record(a,'blocked',{reason:'other_agent',goal:a.goal})}break}a.x=nx;a.y=ny;budget-=s;a.wait=0}if(!a.path.length&&a.goal&&insideOwn(a,a.goal,a.x,a.y))record(a,'goal_reached',{goal:a.goal})}
const now=performance.now();if(now-lastSample>=1000){lastSample=now;trace.push({t:new Date().toISOString(),agents:agents.map(a=>({id:a.id,home:a.home,x:Math.round(a.x),y:Math.round(a.y),zone:zone(a.x+12,a.y+12).room,goal:a.goal,pathRemaining:a.path.length,needs:Object.fromEntries(NEEDS.map(k=>[k,Math.round(a[k])]))}))});if(trace.length>300)trace.shift()}if(now-lastExport>=20000){lastExport=now;exportDiagnostic(false)}}
function diagnostic(){return {schema:'jocarsa-casa-ia-diagnostic-v1',generated_at:new Date().toISOString(),intervalo_ia:interval,world:{width:canvas.width,height:canvas.height,houses:houses.map(h=>({id:h.id,x:h.x,y:h.y,doors:['north','south']}))},agents:agents.map(a=>({id:a.id,name:a.name,home:a.home,position:{x:a.x,y:a.y},zone:zone(a.x+12,a.y+12),goal:a.goal,thought:a.thought,needs:Object.fromEntries(NEEDS.map(k=>[k,a[k]]))})),events:events.slice(-1200),movement_samples:trace.slice(-120)}}
function exportDiagnostic(manual=true){const data=diagnostic();fetch('/api/diagnostico',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(e=>console.warn('No se guardó JSON:',e));if(manual){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='diagnostico-casa-ia-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.getElementById('download').onclick=()=>exportDiagnostic(true);const slider=document.getElementById('period');slider.value=localStorage.getItem('ia-period')||20;interval=+slider.value;document.getElementById('periodLabel').textContent=interval;slider.oninput=()=>{interval=+slider.value;document.getElementById('periodLabel').textContent=interval;localStorage.setItem('ia-period',interval)};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function draw(){rect(0,0,1216,1216,'#668d56');for(let y=0;y<1216;y+=32)for(let x=0;x<1216;x+=32)if((x/32+y/32)%3===0)rect(x+10,y+12,3,4,'#729b60');for(const h of houses){for(let r=0;r<16;r++)for(let c=0;c<16;c++){const x=h.x+c*T,y=h.y+r*T,v=tile(h,c,r),color={'#':'#503c2e','.':'#bd8b57',c:'#c6b99b',d:'#b58d68',b:'#a2c7cb'}[v];rect(x,y,32,32,color);if(v==='#'){rect(x,y,32,5,'#7d6047');rect(x,y+27,32,5,'#33271f')}else if(v==='.'||v==='d'){rect(x,y+15,32,1,'#94704b')}else rect(x,y,32,1,'#ffffff30')}ctx.fillStyle='#e8e5dc';ctx.font='bold 16px monospace';ctx.fillText('CASA '+h.id,h.x+12,h.y+25)}for(const f of furniture){rect(f.x+3,f.y+4,f.w,f.h,'#45372c');rect(f.x,f.y,f.w,f.h,f.color);rect(f.x+4,f.y+4,Math.max(0,f.w-8),3,'#ffffff33')}for(const a of agents){if(a.path.length){ctx.save();ctx.strokeStyle='#20e8fa';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(a.x+12,a.y+12);for(const p of a.path)ctx.lineTo(p.x+12,p.y+12);ctx.stroke();ctx.restore()}rect(a.x+4,a.y,16,10,'#513626');rect(a.x+5,a.y+8,14,10,'#efc296');rect(a.x+3,a.y+18,18,8,'#467db3');rect(a.x+4,a.y+25,6,4,'#353232');rect(a.x+14,a.y+25,6,4,'#353232');NEEDS.forEach((k,i)=>{rect(a.x-5,a.y-39+i*8,34,6,'#1a1a1a');rect(a.x-4,a.y-38+i*8,32*a[k]/100,4,colors[k])});ctx.font='12px monospace';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#252525';ctx.fillStyle='white';ctx.strokeText(a.name,a.x+12,a.y+43);ctx.fillText(a.name,a.x+12,a.y+43);if(a.thought&&performance.now()<a.until){const msg=a.thought.slice(0,36),w=Math.max(80,Math.min(300,msg.length*7+12)),bx=Math.max(2,Math.min(1216-w-2,a.x+12-w/2)),by=Math.max(2,a.y-68);rect(bx,by,w,23,'#fff9e9');ctx.fillStyle='#252525';ctx.fillText(msg,bx+w/2,by+16)}}document.getElementById('status').textContent=`${agents.length} personajes · 4 casas · jardín compartido · Diagnóstico automático cada 20 segundos`}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.onpointerdown=e=>{const p=point(e),a=[...agents].reverse().find(a=>p.x>=a.x-6&&p.x<=a.x+30&&p.y>=a.y-10&&p.y<=a.y+36);if(!a)return;drag={a,dx:p.x-a.x,dy:p.y-a.y,old:{x:a.x,y:a.y}};a.dragging=true;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const p=point(e),x=p.x-drag.dx,y=p.y-drag.dy;if(free(x,y)){drag.a.x=x;drag.a.y=y}};function release(){if(!drag)return;const a=drag.a;a.dragging=false;a.path=[];a.elapsed=interval;record(a,'drag',{from:drag.old,to:{x:a.x,y:a.y}});drag=null}canvas.onpointerup=release;canvas.onpointercancel=release;
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
