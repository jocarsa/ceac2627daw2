<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo completo de tipos</title>
</head>
<body>

    <h1>Ejemplo completo de tipos de datos</h1>

    <p>
        Abre la consola del navegador para comprobar
        los valores y sus tipos.
    </p>

    <script>
        console.log("=== CURSO DE PROGRAMACIÓN ===");


        // -------------------------
        // STRING
        // -------------------------

        const titulo = "JavaScript básico";


        // -------------------------
        // NUMBER
        // -------------------------

        const duracionHoras = 30;

        const precio = 49.99;


        // -------------------------
        // BOOLEAN
        // -------------------------

        const disponible = true;


        // -------------------------
        // NULL
        // -------------------------

        let alumnoSeleccionado = null;


        // -------------------------
        // UNDEFINED
        // -------------------------

        let fechaInicio;


        // -------------------------
        // OBJECT
        // -------------------------

        const profesor = {
            nombre: "Laura",
            departamento: "Informática"
        };


        // -------------------------
        // ARRAY
        // -------------------------

        const tecnologias = [
            "HTML",
            "CSS",
            "JavaScript"
        ];


        // -------------------------
        // BIGINT
        // -------------------------

        const identificador = 12345678901234567890n;


        // -------------------------
        // MOSTRAMOS LOS DATOS
        // -------------------------

        console.log("Título:");

        console.log(titulo);

        console.log("Tipo:");

        console.log(typeof titulo);


        console.log("-----------------------");


        console.log("Duración:");

        console.log(duracionHoras);

        console.log("Tipo:");

        console.log(typeof duracionHoras);


        console.log("-----------------------");


        console.log("Precio:");

        console.log(precio);

        console.log("Tipo:");

        console.log(typeof precio);


        console.log("-----------------------");


        console.log("Disponible:");

        console.log(disponible);

        console.log("Tipo:");

        console.log(typeof disponible);


        console.log("-----------------------");


        console.log("Alumno seleccionado:");

        console.log(alumnoSeleccionado);

        console.log("Tipo:");

        console.log(typeof alumnoSeleccionado);


        console.log("-----------------------");


        console.log("Fecha de inicio:");

        console.log(fechaInicio);

        console.log("Tipo:");

        console.log(typeof fechaInicio);


        console.log("-----------------------");


        console.log("Profesor:");

        console.log(profesor);

        console.log("Tipo:");

        console.log(typeof profesor);


        console.log("-----------------------");


        console.log("Tecnologías:");

        console.log(tecnologias);

        console.log("typeof:");

        console.log(typeof tecnologias);

        console.log("¿Es un array?");

        console.log(Array.isArray(tecnologias));


        console.log("-----------------------");


        console.log("Identificador:");

        console.log(identificador);

        console.log("Tipo:");

        console.log(typeof identificador);
    </script>

</body>
</html>
