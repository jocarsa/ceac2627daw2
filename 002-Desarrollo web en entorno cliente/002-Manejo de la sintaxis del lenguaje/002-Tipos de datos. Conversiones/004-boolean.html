<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo boolean</title>
</head>
<body>

    <h1>Tipo boolean</h1>
    <p>Abre la consola del navegador para ver los resultados.</p>

    <script>
        console.log("=== BOOLEAN ===");


        const usuarioActivo = true;

        const productoDisponible = false;

        const tieneDescuento = true;


        console.log("Usuario activo:");
        console.log(usuarioActivo);

        console.log("Producto disponible:");
        console.log(productoDisponible);

        console.log("Tiene descuento:");
        console.log(tieneDescuento);


        console.log("Tipos:");

        console.log(typeof usuarioActivo);
        console.log(typeof productoDisponible);


        // -------------------------
        // BOOLEAN Y NUMBER
        // -------------------------

        const booleano = true;

        const numero = 1;

        console.log("Valor booleano:");
        console.log(booleano);

        console.log("Tipo:");
        console.log(typeof booleano);


        console.log("Valor numérico:");
        console.log(numero);

        console.log("Tipo:");
        console.log(typeof numero);
    </script>

</body>
</html>
