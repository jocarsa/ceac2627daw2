<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>undefined y null</title>
</head>
<body>

    <h1>undefined y null</h1>
    <p>Abre la consola del navegador para ver los resultados.</p>

    <script>
        console.log("=== UNDEFINED Y NULL ===");


        // -------------------------
        // UNDEFINED
        // -------------------------

        let nombre;

        console.log("Variable sin valor asignado:");

        console.log(nombre);

        console.log("Tipo:");
        console.log(typeof nombre);


        // -------------------------
        // NULL
        // -------------------------

        let usuarioSeleccionado = null;

        console.log("Usuario seleccionado:");

        console.log(usuarioSeleccionado);

        console.log("Tipo:");
        console.log(typeof usuarioSeleccionado);


        // -------------------------
        // DIFERENCIA
        // -------------------------

        let dato1;

        let dato2 = null;


        console.log("----------------------");

        console.log("dato1:");
        console.log(dato1);

        console.log("dato2:");
        console.log(dato2);


        // -------------------------
        // PECULIARIDAD DE NULL
        // -------------------------

        console.log("typeof null:");

        console.log(typeof null);
    </script>

</body>
</html>
