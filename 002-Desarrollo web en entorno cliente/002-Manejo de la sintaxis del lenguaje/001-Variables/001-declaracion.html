<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaración e inicialización</title>
</head>
<body>

    <h1>Declaración, inicialización y asignación</h1>
    <p>Abre la consola del navegador para ver los resultados.</p>

    <script>
        console.log("=== DECLARACIÓN, INICIALIZACIÓN Y ASIGNACIÓN ===");

        // Declaración
        let edad;

        console.log("Valor después de declarar:");
        console.log(edad);


        // Primera asignación
        edad = 20;

        console.log("Valor después de asignar 20:");
        console.log(edad);


        // Reasignación
        edad = 21;

        console.log("Valor después de reasignar:");
        console.log(edad);


        // Declaración e inicialización en la misma instrucción
        let puntuacion = 100;

        console.log("Puntuación:");
        console.log(puntuacion);


        // Una variable puede utilizarse para calcular otra
        let puntuacionFinal = puntuacion + 50;

        console.log("Puntuación final:");
        console.log(puntuacionFinal);
    </script>

</body>
</html>
